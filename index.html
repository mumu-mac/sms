<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>账号登录</title>
  <style>
    :root{
      --bg: #eef2f8;
      --text: #1b2230;
      --muted: #667085;
      --line: #e4e7f1;
      --panel: #ffffff;
      --panel-soft: #f8f9ff;
      --purple: #7668f7;
      --purple-deep: #5b67ef;
      --purple-light: #b2c9ff;
      --orange-bg: #fff7ed;
      --orange-line: #f0d6b6;
      --orange-text: #cf7a2c;
      --shadow: 0 14px 32px rgba(82, 92, 149, .10);
      --copy-size: 14px;
    }

    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--text);overflow-x:hidden;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
    body{display:flex;justify-content:center;align-items:flex-start}

    .stage{
      --fit-scale: 1;
      width:100%;
      min-height:100dvh;
      display:flex;
      justify-content:center;
      align-items:flex-start;
      overflow:hidden;
      padding:0 0 14px;
    }

    .phone{
      width:393px;
      flex:0 0 393px;
      min-height:100dvh;
      background:linear-gradient(180deg,#f7f8fc 0%,#eef2f8 100%);
      position:relative;
      overflow:hidden;
      transform:scale(var(--fit-scale));
      transform-origin:top center;
    }

    .card{
      margin:12px 12px 14px;
      border-radius:26px;
      background:var(--panel);
      box-shadow:var(--shadow);
      overflow:hidden;
      border:1px solid rgba(132, 143, 189, .08);
    }

    .hero{
      position:relative;
      padding:18px 20px 16px;
      min-height:148px;
      color:#fff;
      background:
        radial-gradient(105% 62% at 68% 116%, rgba(179,210,255,.48) 0 45%, rgba(179,210,255,0) 46%),
        linear-gradient(104deg, rgba(255,255,255,0) 0 28%, rgba(255,255,255,.12) 28.4% 41%, rgba(255,255,255,0) 41.4% 100%),
        linear-gradient(118deg,#755ff7 0%,#776bf8 48%,#8abafb 100%);
      overflow:hidden;
    }
    .hero:before{
      content:"";position:absolute;right:-28px;top:-28px;width:104px;height:104px;border-radius:50%;background:rgba(255,255,255,.16);transform:none
    }
    .hero:after{
      content:"";position:absolute;right:27px;top:79px;width:125px;height:125px;border:4px solid rgba(255,255,255,.13);border-radius:35px;transform:rotate(-9deg)
    }
    .hero-top{
      display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1
    }
    .safe{
      display:flex;align-items:center;gap:6px;font-size:var(--copy-size);font-weight:600
    }
    .safe-dot{
      width:18px;height:18px;border-radius:50%;border:1.5px solid rgba(255,255,255,.82);position:relative;flex:none
    }
    .safe-dot:before{
      content:"";position:absolute;left:4px;top:5px;width:6px;height:8px;border-right:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(40deg)
    }
    .active-pill{
      min-width:72px;
      padding:7px 12px;
      border-radius:999px;
      background:rgba(255,255,255,.14);
      border:1px solid rgba(255,255,255,.34);
      color:#fff;
      font-family:inherit;
      font-size:var(--copy-size);
      font-weight:600;
      line-height:1;
      cursor:pointer;
      appearance:none;
      -webkit-appearance:none;
      transition:background .18s ease,border-color .18s ease,opacity .18s ease;
    }
    .active-pill.is-inactive{
      background:linear-gradient(180deg,#f66b6b 0%,#d93c3c 100%);
      border-color:rgba(255,255,255,.18);
      box-shadow:0 10px 18px rgba(200, 53, 53, .18);
    }
    .active-pill.is-pending{
      opacity:.78;
      cursor:wait;
    }
    .active-pill.is-active{
      background:rgba(255,255,255,.18);
      border-color:rgba(255,255,255,.44);
    }
    .active-pill:focus-visible{
      outline:2px solid rgba(255,255,255,.72);
      outline-offset:3px;
    }
    .hero h1{
      margin:30px 0 10px;
      padding-left:26px;
      font-size:26px;
      line-height:1;
      font-weight:900 !important;
      color:#fff;
      text-shadow:
        .3px 0 0 currentColor,
        -.3px 0 0 currentColor,
        0 .3px 0 currentColor,
        0 -.3px 0 currentColor;
      letter-spacing:.35px;
      position:relative;
      z-index:1;
    }
    .hero p{
      margin:0;
      padding-left:26px;
      font-size:12px;
      line-height:1.35;
      font-weight:700;
      opacity:.9;
      position:relative;
      z-index:1;
    }
    .hero-art{
      position:absolute;right:48px;bottom:2px;width:72px;height:72px;border-radius:20px;background:rgba(255,255,255,.045);transform:rotate(0deg)
    }
    .hero-art:before{
      content:"";position:absolute;left:17px;top:10px;width:22.5px;height:40.5px;border-right:9.6px solid rgba(255,255,255,.67);border-bottom:9.6px solid rgba(255,255,255,.67);transform:rotate(39deg);border-radius:4px
    }

    .notice{
      margin:-8px 26px 10px;
      min-height:40px;
      border-radius:23px;
      background:linear-gradient(180deg,#fffaf3,#fff6eb);
      border:1px solid rgba(239, 212, 181, .72);
      display:flex;
      align-items:center;
      justify-content:center;
      gap:6px;
      padding:4px 12px;
      box-shadow:0 5px 14px rgba(241,166,63,.05);
      position:relative;
      z-index:2;
    }
    .warn{
      width:24px;height:24px;border-radius:8px;background:#ffcc55;color:#7b4900;font-size:var(--copy-size);font-weight:900;display:flex;align-items:center;justify-content:center;flex:none
    }
    .notice strong{
      font-size:14px;
      line-height:1.3;
      font-family:inherit;
      font-weight:inherit;
      color:#000;
      letter-spacing:0;
      white-space:nowrap;
      font-synthesis:none;
    }
    .notice strong.card-key-notice{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:2px;
      white-space:normal;
      text-align:center;
    }
    .notice.is-card-used{
      background:linear-gradient(180deg,#f8fafc,#f2f4f7);
      border-color:rgba(152, 162, 179, .42);
    }
    .notice.is-card-used .warn{
      background:#d0d5dd;
      color:#667085;
    }
    .card-key-notice.is-card-used-text{
      color:#98a2b3;
      text-decoration:line-through;
      text-decoration-thickness:2px;
      text-decoration-color:#98a2b3;
    }
    .card-used-warning{
      color:#d92d20;
      font-size:13px;
      line-height:1.25;
      font-weight:900;
    }

    .login-panel{
      margin:0 26px 10px;
      border-radius:28px;
      padding:11px 16px 10px;
      background:linear-gradient(180deg,#fdfdff 0%,#f8f9ff 100%);
      border:1px solid rgba(218, 222, 240, .78);
      box-shadow:0 8px 22px rgba(85, 98, 152, .045);
    }
    .row{
      display:grid;
      grid-template-columns:50px minmax(0,1fr) 62px;
      gap:2px;
      align-items:center;
      margin:0;
    }
    .row + .row{
      margin-top:12px;
    }
    .row label{
      font-size:13px;
      font-weight:900;
      color:#1b2431;
      letter-spacing:0;
      white-space:nowrap;
    }
    .value{
      height:40px;
      border-radius:20px;
      background:linear-gradient(180deg,#ffffff 0%,#fbfcff 100%);
      border:1px solid rgba(224, 228, 240, .86);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 1px 5px rgba(91,105,156,.035);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:0 18px;
      font-size:14px;
      font-weight:900;
      color:#000;
      letter-spacing:0;
      white-space:nowrap;
      overflow:hidden;
    }
    #phoneView,
    #codeView{
      font-size:14px;
      font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
      font-weight:900;
      font-style:normal;
      font-synthesis:none;
      letter-spacing:.35px;
    }
    #phoneView.is-fetched{
      font-weight:900 !important;
      text-shadow:
        .22px 0 0 currentColor,
        -.22px 0 0 currentColor,
        0 .22px 0 currentColor,
        0 -.22px 0 currentColor;
    }
    .copy{
      height:40px;
      border:none;
      border-radius:16px;
      background:linear-gradient(180deg,#856cf7 0%,#5974ef 100%);
      color:#fff;
      font-size:13px;
      font-weight:900;
      cursor:pointer;
      box-shadow:0 8px 14px rgba(103,115,243,.24);
      letter-spacing:0;
    }

    .tip{
      margin:10px 46px 12px;
      padding:8px 14px;
      border-radius:18px;
      background:var(--orange-bg);
      border:1px solid rgba(240, 214, 182, .72);
      color:var(--orange-text);
      text-align:center;
      font-size:14px;
      font-family:inherit;
      font-weight:inherit;
      line-height:1.4;
      letter-spacing:0;
      font-synthesis:none;
    }

    .help{
      margin:0 14px 14px;
      padding:10px 10px 10px;
      border-radius:18px;
      background:#f9fafe;
      border:1px solid rgba(220, 225, 241, .76);
      box-shadow:0 7px 20px rgba(85, 98, 152, .035);
    }
    .help-head{
      display:flex;
      align-items:center;
      gap:7px;
      margin-bottom:6px;
    }
    .q{
      width:24px;height:24px;border-radius:8px;background:linear-gradient(180deg,#8771f8,#6d61f0);color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 8px 14px rgba(120,110,240,.22)
    }
    .help h2{
      margin:0;
      font-size:15px;
      line-height:1.12;
      font-family:inherit;
      font-weight:inherit;
      color:#000;
      letter-spacing:0;
      font-synthesis:none;
    }
    .help ol{
      list-style:none;
      padding:0;
      margin:4px 0 0;
    }
    .help li{
      display:grid;
      grid-template-columns:22px 1fr;
      gap:5px;
      align-items:center;
      margin:2px 0;
    }
    .step{
      width:22px;height:22px;border-radius:50%;background:linear-gradient(180deg,#f1edff,#e7e2ff);color:#6c5ff0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex:none
    }
    .help p{
      margin:0;
      color:#4f5568;
      font-size:var(--copy-size);
      line-height:1.14;
      min-height:22px;
      display:flex;
      align-items:center;
      letter-spacing:0;
      font-family:inherit;
      font-weight:inherit;
      font-synthesis:none;
    }
    .guide-image{
      display:block;
      width:100%;
      height:auto;
      margin-top:8px;
      border-radius:12px;
      border:1px solid rgba(220, 225, 241, .9);
      background:#66c3b0;
    }

    .hero h1,
    .notice strong,
    .value,
    .tip,
    .help h2,
    .help p{
      font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
      font-weight:900;
      font-style:normal;
      font-synthesis:none;
      letter-spacing:.35px;
      -webkit-font-smoothing:antialiased;
      text-rendering:geometricPrecision;
    }

    .toast{
      position:fixed;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%) translateY(10px);
      background:rgba(18,24,38,.92);
      color:#fff;
      padding:10px 14px;
      border-radius:12px;
      font-size:var(--copy-size);
      font-weight:700;
      opacity:0;
      pointer-events:none;
      transition:.18s ease;
      max-width:min(92vw,420px);
      text-align:center;
      z-index:99;
      letter-spacing:0;
    }
    .toast.show{opacity:1;transform:translate(-50%,-50%) translateY(0)}

    .modal-backdrop{
      position:fixed;
      inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      padding:20px;
      background:rgba(18, 24, 40, .55);
      backdrop-filter:blur(4px);
      z-index:50;
    }
    .modal-backdrop.is-open{display:flex}
    .modal{
      width:min(340px, 100%);
      border-radius:22px;
      background:#fff;
      box-shadow:0 24px 50px rgba(18, 24, 40, .22);
      overflow:hidden;
      border:1px solid rgba(132, 143, 189, .16);
    }
    .modal-head{
      padding:16px 18px 10px;
      border-bottom:1px solid var(--line);
    }
    .modal-head h2{
      margin:0;
      font-size:18px;
      line-height:1.2;
      color:var(--text);
    }
    .modal-head p{
      margin:6px 0 0;
      font-size:12px;
      line-height:1.4;
      color:var(--muted);
    }
    .modal-body{
      padding:14px 18px 18px;
      display:grid;
      gap:12px;
    }
    .modal-body label{
      display:grid;
      gap:8px;
      font-size:13px;
      font-weight:700;
      color:var(--text);
    }
    .modal-input{
      height:42px;
      border-radius:14px;
      border:1px solid #d6dceb;
      padding:0 12px;
      font:inherit;
      color:var(--text);
      background:#fff;
      outline:none;
    }
    .modal-input:focus{
      border-color:var(--purple-deep);
      box-shadow:0 0 0 3px rgba(91, 103, 239, .14);
    }
    .modal-actions{
      display:flex;
      gap:10px;
      justify-content:flex-end;
      padding-top:2px;
    }
    .modal-btn{
      min-width:78px;
      height:38px;
      border-radius:12px;
      border:1px solid transparent;
      font:inherit;
      font-size:13px;
      font-weight:700;
      cursor:pointer;
      background:#f4f6fb;
      color:var(--text);
    }
    .modal-btn.primary{
      background:var(--purple-deep);
      color:#fff;
    }
    .modal-btn.secondary{
      background:#edf1f8;
      color:#44506a;
    }

    .preflight-modal{
      width:min(352px, 100%);
      max-height:calc(100dvh - 28px);
      border-radius:20px;
      background:#fff;
      box-shadow:0 24px 50px rgba(18, 24, 40, .24);
      overflow:auto;
      border:1px solid rgba(132, 143, 189, .16);
    }
    .preflight-head{
      padding:14px 15px 9px;
      border-bottom:1px solid var(--line);
      text-align:center;
    }
    .preflight-head h2{
      margin:0;
      color:var(--text);
      font-size:16px;
      line-height:1.2;
    }
    .preflight-head p{
      margin:5px 0 0;
      color:var(--muted);
      font-size:12px;
      line-height:1.3;
    }
    .preflight-image{
      display:block;
      width:auto;
      max-width:100%;
      height:auto;
      max-height:calc(100dvh - 190px);
      margin:0 auto;
      object-fit:contain;
      background:#66c3b0;
    }
    .preflight-actions{
      display:flex;
      gap:8px;
      padding:10px 12px 12px;
      border-top:1px solid var(--line);
    }
    .preflight-actions .modal-btn{
      flex:1;
      min-width:0;
      height:38px;
    }

    @media (max-width: 393px){
      .stage{padding:0}
    }
  </style>
</head>
<body>
  <div class="stage">
    <main class="phone" id="phoneShell">
      <section class="card">
        <section class="hero">
          <h1>自助系统</h1>
          <p>仔细阅读使用说明，不懂找客服！</p>
          <div class="hero-art" aria-hidden="true"></div>
        </section>

        <div class="notice">
          <div class="warn">!</div>
          <strong id="queueNotice" class="card-key-notice">读取中</strong>
        </div>

        <section class="login-panel" aria-label="登录信息">
          <div class="row">
            <label>登录号：</label>
            <div class="value" id="phoneView">打开软件后再获取</div>
            <button class="copy" type="button" data-get="account">获取</button>
          </div>
          <div class="row">
            <label>验证码：</label>
            <div class="value" id="codeView">获取后5分钟有效</div>
          </div>
        </section>

        <div class="tip">号码具有时效性，未打开软件请勿获取</div>

        <section class="help" aria-label="验证码帮助">
          <div class="help-head">
            <div class="q">?</div>
            <h2>使用说明：</h2>
          </div>
          <ol>
            <li><span class="step">1</span><p>打开电脑端软件后点击获取</p></li>
            <li><span class="step">2</span><p>获取验证码，返回本页等待验证码</p></li>
            <li><span class="step">3</span><p>将验证码输入客户端软件即可使用</p></li>
            <li><span class="step">4</span><p>有问题找客服！</p></li>
          </ol>
          <img class="guide-image" data-guide-image alt="打开软件后的操作提醒" loading="lazy">
        </section>
      </section>

    </main>
  </div>

  <div class="modal-backdrop" id="activationModal" aria-hidden="true">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="activationModalTitle">
      <div class="modal-head">
        <h2 id="activationModalTitle">输入卡密</h2>
        <p>点击确认后会向服务器发送激活请求。</p>
      </div>
      <form class="modal-body" id="activationForm">
        <label for="activationInput">
          卡密
          <input class="modal-input" id="activationInput" name="cardKey" type="text" autocomplete="off" placeholder="请输入卡密">
        </label>
        <div class="modal-actions">
          <button class="modal-btn secondary" id="activationCancel" type="button">取消</button>
          <button class="modal-btn primary" type="submit">确认激活</button>
        </div>
      </form>
    </section>
  </div>

  <div class="modal-backdrop" id="preflightModal" aria-hidden="true">
    <section class="preflight-modal" role="dialog" aria-modal="true" aria-labelledby="preflightTitle">
      <div class="preflight-head">
        <h2 id="preflightTitle">请先确认已经打开软件</h2>
        <p>如已打开请忽略。</p>
      </div>
      <img class="preflight-image" data-guide-image alt="打开软件后的操作提醒">
      <div class="preflight-actions">
        <button class="modal-btn secondary" id="preflightCancel" type="button">返回</button>
        <button class="modal-btn primary" id="preflightConfirm" type="button">已打开，继续获取</button>
      </div>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

    const phoneView = document.getElementById('phoneView');
    const codeView = document.getElementById('codeView');
    const notice = document.getElementById('queueNotice');
    const noticeBox = document.querySelector('.notice');
    const toast = document.getElementById('toast');
    const activationModal = document.getElementById('activationModal');
    const activationForm = document.getElementById('activationForm');
    const activationInput = document.getElementById('activationInput');

    const preflightConfirm = document.getElementById('preflightConfirm');

    const phoneShell = document.getElementById('phoneShell');
    const activationButton = document.getElementById('activationButton');

    const clientId = getClientId();
    let activationPasswordFromUrl = false;
    let activationPassword = getActivationPassword();
    const mqttTopics = createMqttTopics(clientId);

    let mqttClient = null;
    let mqttConnectPromise = null;
    let isActivated = false;
    let activationToken = '';
    let activationExpiresAt = 0;
    let activationExpireTimer = null;
    let activationCheckIntervalTimer = null;
    let pendingAuthRequestId = '';
    let pendingAuthCheckRequestId = '';
    let pendingAccountRequestId = '';
    let authTimeoutTimer = null;
    let authCheckTimeoutTimer = null;
    let accountTimeoutTimer = null;
    let authCheckResolve = null;
    let authCheckReject = null;
    let authCheckPromise = null;
    let pendingAuthCheckSilent = false;

    let codeExpireTimer = null;
    let currentRequestId = 0;
    let getPreflightConfirmed = false;
    let getPreflightResolve = null;
    let getPreflightPromise = null;

    function getClientId() {
      const storageKey = 'mumu_svip_client_id';
      const saved = localStorage.getItem(storageKey);
      if (saved && /^[a-zA-Z0-9_-]{8,80}$/.test(saved)) return saved;

      const next = (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}_${Math.random().toString(16).slice(2)}`).replace(/-/g, '');
      localStorage.setItem(storageKey, next);
      return next;
    }

    function getActivationPassword() {
      const params = new URLSearchParams(location.search);
      for (const name of EMQX_CONFIG.activationParamNames) {
        const value = params.get(name);
        if (value && value.trim()) {
          const password = value.trim();
          activationPasswordFromUrl = true;
          localStorage.setItem(activationPasswordStorageKey, password);
          cleanActivationParamsFromUrl(params);
          return password;
        }
      }
      return localStorage.getItem(activationPasswordStorageKey) || '';
    }

    function cleanActivationParamsFromUrl(params) {
      const nextParams = new URLSearchParams(params);
      EMQX_CONFIG.activationParamNames.forEach((name) => nextParams.delete(name));
      const query = nextParams.toString();
      const nextUrl = `${location.pathname}${query ? `?${query}` : ''}${location.hash}`;
      history.replaceState(null, '', nextUrl);
    }

    function setActivationPassword(value) {
      activationPassword = String(value || '').trim();
      if (activationPassword) {
        localStorage.setItem(activationPasswordStorageKey, activationPassword);
      } else {
        localStorage.removeItem(activationPasswordStorageKey);
      }
    }

    function openActivationModal() {
      if (isActivated) {
        showToast('服务已激活');
        return;
      }

      activationInput.value = activationPassword || '';
      activationModal.classList.add('is-open');
      activationModal.setAttribute('aria-hidden', 'false');
      setTimeout(() => activationInput.focus(), 0);
    }

    function closeActivationModal() {
      activationModal.classList.remove('is-open');
      activationModal.setAttribute('aria-hidden', 'true');
    }

    function hydrateGuideImages() {
      document.querySelectorAll('[data-guide-image]').forEach((image) => {
        image.src = usageGuideImageSrc;
      });
    }

    function requestGetPreflight() {
      if (getPreflightConfirmed || !preflightModal) return Promise.resolve(true);
      if (getPreflightPromise) return getPreflightPromise;

      preflightModal.classList.add('is-open');
      preflightModal.setAttribute('aria-hidden', 'false');
      getPreflightPromise = new Promise((resolve) => {
        getPreflightResolve = resolve;
      });
      return getPreflightPromise;
    }

    function resolveGetPreflight(confirmed) {
      if (confirmed) getPreflightConfirmed = true;
      preflightModal?.classList.remove('is-open');
      preflightModal?.setAttribute('aria-hidden', 'true');
      const resolve = getPreflightResolve;
      getPreflightResolve = null;
      getPreflightPromise = null;
      resolve?.(confirmed);
    }

    function createRequestId(prefix) {
      return `${prefix}_${Date.now()}_${Math.random().toString(16).slice(2)}`;
    }

    function createMqttTopics(id) {
      const root = EMQX_CONFIG.topicRoot.replace(/^\/+|\/+$/g, '');
      return {
        authRequest: `${root}/${__p.ar}/${id}`,
        authResult: `${root}/${__p.as}/${id}`,
        authCheckRequest: `${root}/${__p.acr}/${id}`,
        authCheckResult: `${root}/${__p.acs}/${id}`,
        accountRequest: `${root}/${__p.nr}/${id}`,
        accountResult: `${root}/${__p.ns}/${id}`,
        codeResult: `${root}/${__p.cr}/${id}`,
        status: `${root}/${__p.st}/${id}`
      };
    }

    function formatSvipPhone(phone) {
      return String(phone || '').trim().replace(/^\*/, '1');
    }

    function showToast(text) {
      toast.textContent = text;
      toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('show'), 1300);
    }

    function getUsedCardKeys() {
      try {
        const saved = JSON.parse(localStorage.getItem(usedCardStorageKey) || '{}');
        return saved && typeof saved === 'object' && !Array.isArray(saved) ? saved : {};
      } catch (error) {
        return {};
      }
    }

    function isCurrentCardUsed() {
      return Boolean(activationPassword && getUsedCardKeys()[activationPassword]);
    }

    function setNoticeText(text, options = {}) {
      noticeBox.classList.toggle('is-card-used', options.used === true);
      notice.classList.remove('is-card-used-text');
      notice.textContent = text;
    }

    function renderCardKeyNotice(forceUsed = false) {
      const cardKey = activationPassword || missingCardKeyText;
      const used = forceUsed || isCurrentCardUsed();
      noticeBox.classList.toggle('is-card-used', used);
      notice.classList.toggle('is-card-used-text', used);
      notice.textContent = cardKey;
    }

    function renderCardKeyError(message) {
      noticeBox.classList.add('is-card-used');
      notice.classList.remove('is-card-used-text');
      notice.textContent = activationPassword || missingCardKeyText;
      const warning = document.createElement('span');
      warning.className = 'card-used-warning';
      warning.textContent = message;
      notice.appendChild(warning);
    }

    function markCurrentCardUsed() {
      if (activationPassword) {
        const usedCards = getUsedCardKeys();
        usedCards[activationPassword] = Date.now();
        localStorage.setItem(usedCardStorageKey, JSON.stringify(usedCards));
      }
      renderCardKeyNotice(true);
    }

    function formatCountdown(totalSeconds) {
      const minutes = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
      const seconds = String(totalSeconds % 60).padStart(2, '0');
      return `${minutes}:${seconds}`;
    }

    function formatWaitingCountdown(totalSeconds) {
      return `${formatCountdown(totalSeconds)} 等待中`;
    }

    function clearCodeTimers() {
      clearInterval(countdownTimer);
      clearTimeout(codeRevealTimer);
      clearTimeout(codeExpireTimer);
      countdownTimer = null;
      codeRevealTimer = null;
      codeExpireTimer = null;
    }

    function clearAccountTimer() {
      clearTimeout(accountTimeoutTimer);
      accountTimeoutTimer = null;
    }

    function setActivationState(state, text) {
      if (!activationButton) return;
      activationButton.textContent = text;
      activationButton.classList.toggle('is-inactive', state === 'inactive');
      activationButton.classList.toggle('is-pending', state === 'pending');
      activationButton.classList.toggle('is-active', state === 'active');
      activationButton.disabled = state === 'pending';
    }

    function hasEmqxConfig() {
      return Boolean(
        EMQX_CONFIG.wsUrl &&
        !EMQX_CONFIG.wsUrl.includes('你的EMQX') &&
        EMQX_CONFIG.username &&
        EMQX_CONFIG.password
      );
    }

    function clearActivationSession() {
      clearTimeout(activationExpireTimer);
      clearInterval(activationCheckIntervalTimer);
      activationExpireTimer = null;
      activationCheckIntervalTimer = null;
      activationToken = '';
      activationExpiresAt = 0;
      localStorage.removeItem(activationSessionStorageKey);
    }

    function deactivateService(message) {
      isActivated = false;
      clearActivationSession();
      clearCodeTimers();
      clearAccountTimer();
      pendingAccountRequestId = '';
      phoneView.classList.remove('is-fetched');
      phoneView.dataset.full = '';
      codeView.dataset.full = '';
      phoneView.textContent = '打开软件后再获取';
      codeView.textContent = '获取后5分钟有效';
      renderCardKeyNotice();
      setActivationState('inactive', '未激活');
      if (message) showToast(message);
    }

    function scheduleActivationExpire() {
      clearTimeout(activationExpireTimer);
      const remaining = activationExpiresAt - Date.now();
      if (remaining <= 0) {
        deactivateService('授权已过期');
        return;
      }

      activationExpireTimer = setTimeout(() => {
        deactivateService('授权已过期');
      }, remaining);
    }

    function startActivationMonitor() {
      clearInterval(activationCheckIntervalTimer);
      if (!isActivated) return;

      activationCheckIntervalTimer = setInterval(() => {
        if (!isActivated || document.visibilityState !== 'visible') return;
        checkActivationWithServer({ silent: true, reason: 'timer' }).catch((error) => {
          console.error(error);
        });
      }, EMQX_CONFIG.activationCheckIntervalMs);
    }

    function saveActivationSession() {
      localStorage.setItem(activationSessionStorageKey, JSON.stringify({
        clientId,
        cardKey: activationPassword,
        token: activationToken,
        expiresAt: activationExpiresAt
      }));
    }

    function restoreActivationSession() {
      try {
        const session = JSON.parse(localStorage.getItem(activationSessionStorageKey) || 'null');
        if (!session || session.clientId !== clientId || session.cardKey !== activationPassword || !session.token || !session.expiresAt || session.expiresAt <= Date.now()) {
          deactivateService();
          return;
        }

        isActivated = true;
        activationToken = session.token || '';
        activationExpiresAt = session.expiresAt;
        setActivationState('active', '已激活');
        renderCardKeyNotice();
        scheduleActivationExpire();
        startActivationMonitor();
        checkActivationWithServer({ silent: true, reason: 'restore' }).catch((error) => {
          console.error(error);
        });
      } catch (error) {
        deactivateService();
      }
    }

    function isActivationValid() {
      if (!isActivated) return false;
      if (!activationExpiresAt || activationExpiresAt <= Date.now()) {
        deactivateService('授权已过期');
        return false;
      }
      return true;
    }

    function resolveActivationExpiresAt(payload) {
      const serverExpiresAt = payload.expiresAt || payload.expireAt || payload.expiredAt;
      const parsedExpiresAt = typeof serverExpiresAt === 'number' ? serverExpiresAt : Date.parse(serverExpiresAt);
      if (Number.isFinite(parsedExpiresAt) && parsedExpiresAt > Date.now()) {
        return parsedExpiresAt;
      }

      const ttlMs = Number(payload.ttlMs || payload.expiresInMs);
      if (Number.isFinite(ttlMs) && ttlMs > 0) {
        return Date.now() + ttlMs;
      }

      return 0;
    }

    function parseMqttPayload(message) {
      const text = typeof message === 'string' ? message : new TextDecoder().decode(message);
      try {
        return JSON.parse(text);
      } catch (error) {
        return { message: text };
      }
    }

    function subscribeMqttTopics() {
      [
        mqttTopics.authResult,
        mqttTopics.authCheckResult,
        mqttTopics.accountResult,
        mqttTopics.codeResult,
        mqttTopics.status
      ].forEach((topic) => {
        mqttClient.subscribe(topic, { qos: EMQX_CONFIG.qos }, (error) => {
          if (error) console.error(`订阅失败：${topic}`, error);
        });
      });
    }

    function ensureMqttConnected() {
      if (!hasEmqxConfig()) {
        return Promise.reject(new Error('请先配置 EMQX 连接信息'));
      }

      if (mqttClient && mqttClient.connected) return Promise.resolve(mqttClient);
      if (mqttConnectPromise) return mqttConnectPromise;
      if (!window.mqtt) return Promise.reject(new Error('MQTT 组件加载失败'));

      mqttConnectPromise = new Promise((resolve, reject) => {
        const connectOptions = {
          clientId: `mumu_svip_${clientId}`,
          username: EMQX_CONFIG.username,
          password: EMQX_CONFIG.password,
          clean: true,
          connectTimeout: 8000,
          reconnectPeriod: 3000
        };

        mqttClient = mqtt.connect(EMQX_CONFIG.wsUrl, connectOptions);

        const timeout = setTimeout(() => {
          reject(new Error('EMQX 连接超时'));
        }, connectOptions.connectTimeout + 1200);

        mqttClient.on('connect', () => {
          clearTimeout(timeout);
          subscribeMqttTopics();
          resolve(mqttClient);
        });

        mqttClient.on('message', handleMqttMessage);
        mqttClient.on('error', (error) => {
          console.error('EMQX 连接错误', error);
        });
      }).finally(() => {
        mqttConnectPromise = null;
      });

      return mqttConnectPromise;
    }

    function publishMqtt(topic, payload) {
      return ensureMqttConnected().then((client) => new Promise((resolve, reject) => {
        client.publish(topic, JSON.stringify(payload), { qos: EMQX_CONFIG.qos, retain: false }, (error) => {
          if (error) reject(error);
          else resolve();
        });
      }));
    }

    function applyActivationGranted(payload, options = {}) {
      const announce = options.announce !== false;
      const message = payload.message || options.message || '';
      const nextToken = payload.token || payload.activationToken || '';
      const nextExpiresAt = resolveActivationExpiresAt(payload);
      if (!nextToken || !Number.isFinite(nextExpiresAt) || nextExpiresAt <= Date.now()) {
        return false;
      }
      isActivated = true;
      activationToken = nextToken;
      activationExpiresAt = nextExpiresAt;
      saveActivationSession();
      scheduleActivationExpire();
      startActivationMonitor();
      setActivationState('active', '已激活');
      if (announce && message) showToast(message);
      return true;
    }

    function clearPendingAuthCheck() {
      clearTimeout(authCheckTimeoutTimer);
      authCheckTimeoutTimer = null;
      authCheckResolve = null;
      authCheckReject = null;
      authCheckPromise = null;
      pendingAuthCheckSilent = false;
    }

    function checkActivationWithServer(options = {}) {
      const silent = options.silent === true;
      if (!activationPassword) {
        deactivateService();
        return Promise.reject(new Error('缺少授权码'));
      }

      if (!isActivated) {
        return Promise.reject(new Error('授权未激活，请联系客服'));
      }

      if (authCheckPromise) return authCheckPromise;

      clearPendingAuthCheck();
      pendingAuthCheckRequestId = createRequestId('auth_check');
      pendingAuthCheckSilent = silent;
      if (!silent) setActivationState('pending', '验证中');

      authCheckPromise = new Promise((resolve, reject) => {
        authCheckResolve = resolve;
        authCheckReject = reject;

      publishMqtt(mqttTopics.authCheckRequest, {
        type: 'auth_check',
        clientId,
        requestId: pendingAuthCheckRequestId,
        cardKey: activationPassword,
        activationToken,
        activationExpiresAt,
        reason: options.reason || 'manual',
          ts: Date.now()
        }).catch((error) => {
          const rejectCheck = authCheckReject;
          clearPendingAuthCheck();
          if (!silent && isActivationValid()) setActivationState('active', '已激活');
          rejectCheck?.(error);
        });

        authCheckTimeoutTimer = setTimeout(() => {
          const rejectCheck = authCheckReject;
          clearPendingAuthCheck();
          if (!silent && isActivationValid()) setActivationState('active', '已激活');
          rejectCheck?.(new Error('授权验证超时'));
        }, EMQX_CONFIG.activationRequestTimeoutMs);
      });

      return authCheckPromise;
    }

    function activateService() {
      if (isActivated) {
        showToast('服务已激活');
        return;
      }

      if (!activationPassword) {
        renderCardKeyNotice();
        showToast('链接缺少卡密，请联系客服');
        return;
      }

      const requestId = createRequestId('auth');
      pendingAuthRequestId = requestId;
      setActivationState('pending', '激活中');
      clearTimeout(authTimeoutTimer);

      const payload = {
        type: 'activate',
        clientId,
        requestId,
        cardKey: activationPassword,
        durationHours: EMQX_CONFIG.activationHours,
        page: location.href,
        userAgent: navigator.userAgent,
        ts: Date.now()
      };

      publishMqtt(mqttTopics.authRequest, payload)
        .then(() => {
          showToast('已提交激活');
          authTimeoutTimer = setTimeout(() => {
            if (isActivated || pendingAuthRequestId !== requestId) return;
            pendingAuthRequestId = '';
            setActivationState('inactive', '未激活');
            showToast('激活超时，请重试');
            authTimeoutTimer = null;
          }, EMQX_CONFIG.activationRequestTimeoutMs);
        })
        .catch((error) => {
          console.error(error);
          pendingAuthRequestId = '';
          clearTimeout(authTimeoutTimer);
          authTimeoutTimer = null;
          setActivationState('inactive', '未激活');
          showToast(error.message || '激活失败');
        });
    }

    function autoActivateFromUrl() {
      if (!activationPasswordFromUrl || isActivated || !activationPassword) return;
      closeActivationModal();
      showToast('正在自动激活');
      activateService();
    }

    function startCodeWait(initialCode) {
      clearCodeTimers();

      const requestId = ++currentRequestId;
      let remaining = Math.floor(codeExpireDelayMs / 1000);
      codeView.textContent = formatWaitingCountdown(remaining);

      countdownTimer = setInterval(() => {
        if (requestId !== currentRequestId) return;
        remaining -= 1;
        if (remaining <= 0) {
          clearCodeTimers();
          codeView.textContent = '联系客服';
          return;
        }
        codeView.textContent = formatWaitingCountdown(remaining);
      }, 1000);

      if (initialCode) {
        codeRevealTimer = setTimeout(() => {
          if (requestId !== currentRequestId) return;
          showCode(initialCode);
        }, codeRevealDelayMs);
      }

      codeExpireTimer = setTimeout(() => {
        if (requestId !== currentRequestId) return;
        clearCodeTimers();
        codeView.textContent = '联系客服';
      }, codeExpireDelayMs);
    }

    function showCode(code) {
      clearCodeTimers();
      codeView.textContent = code;
      codeView.dataset.full = code;
      markCurrentCardUsed();
    }

    function renderAccount(item) {
      const loginValue = formatSvipPhone(item.phone);
      phoneView.textContent = loginValue;
      phoneView.dataset.full = loginValue;
      phoneView.classList.add('is-fetched');
      codeView.dataset.full = '';
      codeView.textContent = '获取后5分钟有效';
      startCodeWait(item.code);
    }

    async function getAccount() {
      if (isCurrentCardUsed()) {
        renderCardKeyNotice(true);
        showToast(cardUsedMessage);
        return;
      }

      const preflightAccepted = await requestGetPreflight();
      if (!preflightAccepted) return;

      if (!isActivationValid()) {
        if (activationPassword) {
          if (!pendingAuthRequestId) activateService();
          showToast('正在激活，请稍后再获取');
        } else {
          renderCardKeyNotice();
          showToast('链接缺少卡密，请联系客服');
        }
        return;
      }

      try {
        await checkActivationWithServer();
      } catch (error) {
        console.error(error);
        showToast(error.message || '授权验证失败');
        return;
      }

      clearCodeTimers();
      clearAccountTimer();
      pendingAccountRequestId = createRequestId('account');
      phoneView.classList.remove('is-fetched');
      phoneView.dataset.full = '';
      codeView.dataset.full = '';
      phoneView.textContent = '分配中';
      codeView.textContent = '等待验证码';
      setNoticeText('正在为你分配登录号，请稍等');

      publishMqtt(mqttTopics.accountRequest, {
        type: 'account_request',
        clientId,
        requestId: pendingAccountRequestId,
        activationToken,
        activationExpiresAt,
        ts: Date.now()
      }).then(() => {
        accountTimeoutTimer = setTimeout(() => {
          if (pendingAccountRequestId !== '') {
            pendingAccountRequestId = '';
            phoneView.classList.remove('is-fetched');
            phoneView.dataset.full = '';
            codeView.dataset.full = '';
            phoneView.textContent = '打开软件后再获取';
            codeView.textContent = '获取后5分钟有效';
            renderCardKeyNotice();
            showToast('获取超时，请重试');
          }
        }, EMQX_CONFIG.accountRequestTimeoutMs);
      }).catch((error) => {
        console.error(error);
        clearAccountTimer();
        pendingAccountRequestId = '';
        phoneView.classList.remove('is-fetched');
        phoneView.dataset.full = '';
        codeView.dataset.full = '';
        phoneView.textContent = '打开软件后再获取';
        codeView.textContent = '获取后5分钟有效';
        renderCardKeyNotice();
        showToast(error.message || '获取失败');
      });
    }

    function handleActivationResult(payload) {
      if (payload.requestId && payload.requestId !== pendingAuthRequestId) return;
      pendingAuthRequestId = '';
      clearTimeout(authTimeoutTimer);
      authTimeoutTimer = null;

      const allowed = payload.ok === true || payload.success === true || payload.allowed === true || payload.status === 'ok';
      const granted = allowed && applyActivationGranted(payload, { message: '激活成功' });
      if (!granted) {
        const reason = payload.reason || '';
        const message = payload.message || '';
        if (reason === 'card_not_found' || reason === 'key_not_found') {
          deactivateService();
          renderCardKeyError(cardInvalidMessage);
          showToast(cardInvalidMessage);
          return;
        }
        if (reason === 'card_used' || reason === 'used' || message.includes('已使用')) {
          deactivateService();
          markCurrentCardUsed();
          showToast(cardUsedMessage);
          return;
        }
        deactivateService(allowed ? '激活信息不完整' : (message || '激活失败'));
        return;
      }
    }

    function handleAuthCheckResult(payload) {
      if (payload.requestId && payload.requestId !== pendingAuthCheckRequestId) return;
      pendingAuthCheckRequestId = '';
      const resolveCheck = authCheckResolve;
      const rejectCheck = authCheckReject;
      const silent = pendingAuthCheckSilent;
      clearPendingAuthCheck();

      const allowed = payload.ok === true || payload.success === true || payload.allowed === true || payload.status === 'ok';
      const granted = allowed && applyActivationGranted(payload, {
        announce: !silent,
        message: payload.message || '授权有效'
      });
      if (!granted) {
        deactivateService(payload.message || '授权已过期');
        rejectCheck?.(new Error(payload.message || '授权已过期'));
        return;
      }
      resolveCheck?.(payload);
    }

    function handleAccountResult(payload) {
      if (payload.requestId && payload.requestId !== pendingAccountRequestId) return;
      clearAccountTimer();
      const ok = payload.ok !== false && payload.success !== false && payload.status !== 'error';
      if (!ok) {
        const reason = payload.reason || '';
        const message = payload.message || '';
        const noPhone = reason === 'no_phone' || message.includes('无号码') || message.includes('号码库暂无可用号码');
        const queueBusy = reason === 'queue_busy' || message.includes('排队');
        const cardUsed = reason === 'card_used' || reason === 'used' || reason === 'already_used' || message.includes('卡密已使用') || message.includes('已使用');
        pendingAccountRequestId = '';
        clearCodeTimers();
        phoneView.classList.remove('is-fetched');
        phoneView.dataset.full = '';
        codeView.dataset.full = '';
        if (cardUsed) {
          phoneView.textContent = '联系客服';
          codeView.textContent = '卡密已使用';
          markCurrentCardUsed();
          showToast(cardUsedMessage);
          return;
        }

        if (noPhone) {
          phoneView.textContent = '无号码';
          codeView.textContent = '联系客服';
          setNoticeText('号码库暂无可用号码，请稍后再试');
          showToast('无号码');
          return;
        }

        if (queueBusy) {
          phoneView.textContent = '请排队等待';
          codeView.textContent = '前面有一人';
          setNoticeText('前面有一人，请排队等待');
          showToast('前面有一人，请排队等待');
          return;
        }

        if (reason === 'expired' || reason === 'revoked' || reason === 'not_activated' || reason === 'token_mismatch' || reason === 'client_mismatch') {
          phoneView.textContent = '未激活';
          codeView.textContent = '请联系客服';
          setNoticeText('请先完成激活审核');
        } else {
          phoneView.textContent = '打开软件后再获取';
          codeView.textContent = '获取后5分钟有效';
          renderCardKeyNotice();
        }
        showToast(message || '分配失败');
        return;
      }

      const phone = payload.phone || payload.account || payload.login || payload.loginNo;
      const code = payload.code || payload.verifyCode || payload.smsCode;
      if (!phone) {
        pendingAccountRequestId = '';
        clearCodeTimers();
        phoneView.classList.remove('is-fetched');
        phoneView.dataset.full = '';
        codeView.dataset.full = '';
        showToast(payload.message || '未收到登录号');
        return;
      }

      renderAccount({ phone, code });
    }

    function handleCodeResult(payload) {
      if (payload.requestId && payload.requestId !== pendingAccountRequestId) return;
      clearAccountTimer();
      const code = payload.code || payload.verifyCode || payload.smsCode;
      if (!code) {
        showToast(payload.message || '未收到验证码');
        return;
      }
      showCode(code);
      pendingAccountRequestId = '';
    }

    function handleMqttMessage(topic, message) {
      const payload = parseMqttPayload(message);
      if (topic === mqttTopics.authResult) {
        handleActivationResult(payload);
        return;
      }
      if (topic === mqttTopics.authCheckResult) {
        handleAuthCheckResult(payload);
        return;
      }
      if (topic === mqttTopics.accountResult) {
        handleAccountResult(payload);
        return;
      }
      if (topic === mqttTopics.codeResult) {
        handleCodeResult(payload);
        return;
      }
      if (topic === mqttTopics.status && payload.message) {
        showToast(payload.message);
      }
    }

    function fitPhone() {
      const scale = Math.min(1, document.documentElement.clientWidth / 393);
      stage.style.setProperty('--fit-scale', scale.toFixed(4));
      phoneShell.style.minHeight = `${Math.ceil(window.innerHeight / scale)}px`;
    }

    if (activationButton) {
      activationButton.addEventListener('click', () => {
        if (isActivated) {
          showToast('服务已激活');
          return;
        }
        openActivationModal();
      });
    }

    activationForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const value = activationInput.value.trim();
      if (!value) {
        showToast('请先输入卡密');
        activationInput.focus();
        return;
      }
      setActivationPassword(value);
      closeActivationModal();
      activateService();
    });

    activationCancel.addEventListener('click', closeActivationModal);
    activationModal.addEventListener('click', (event) => {
      if (event.target === activationModal) closeActivationModal();
    });
    preflightConfirm.addEventListener('click', () => resolveGetPreflight(true));
    preflightCancel.addEventListener('click', () => resolveGetPreflight(false));
    preflightModal.addEventListener('click', (event) => {
      if (event.target === preflightModal) resolveGetPreflight(false);
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && activationModal.classList.contains('is-open')) {
        closeActivationModal();
      }
      if (event.key === 'Escape' && preflightModal.classList.contains('is-open')) {
        resolveGetPreflight(false);
      }
    });

    document.querySelectorAll('[data-get]').forEach((button) => {
      button.addEventListener('click', () => {
        getAccount();
      });
    });

    window.addEventListener('resize', fitPhone);
    hydrateGuideImages();
    renderCardKeyNotice();
    restoreActivationSession();
    autoActivateFromUrl();
    fitPhone();
  </script>
</body>
</html>
