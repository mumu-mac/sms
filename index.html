<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>自助登录</title>
  <style>
    :root{
      color-scheme:light;
      --text:#111;
      --muted:#666;
      --line:#2d2d2d;
      --soft:#fbfbfb;
      --danger:#e53935;
    }
    *{box-sizing:border-box}
    html,body{
      margin:0;
      width:100%;
      min-width:0;
      min-height:100%;
      background:#f5f5f5;
      color:var(--text);
      font-family:"PingFang TC","蘋方-繁","苹方-繁",-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
      font-size:15px;
      font-weight:400;
      letter-spacing:0;
      overflow-x:hidden;
      -webkit-font-smoothing:antialiased;
      text-rendering:geometricPrecision;
    }
    body{
      min-height:100svh;
      display:flex;
      justify-content:center;
    }
    button,input{font:inherit}
    button{-webkit-tap-highlight-color:transparent}
    .page-loader{
      position:fixed;
      inset:0;
      z-index:50;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#fff;
      transition:opacity .2s ease,visibility .2s ease;
    }
    .page-loader.is-hidden{opacity:0;visibility:hidden;pointer-events:none}
    .loader-title{margin:0;font-size:15px;line-height:1.4;font-weight:400}
    .loader-spinner{display:none}
    .first-step-overlay{display:none!important}
    .stage{
      position:relative;
      flex:0 0 min(390px,100vw);
      width:min(390px,100vw);
      max-width:390px;
      min-height:100svh;
      margin:0 auto;
      padding:calc(env(safe-area-inset-top) + 60px) 18px calc(env(safe-area-inset-bottom) + 28px);
      background:#fff;
    }
    .phone,.second-step-content{width:100%;margin:0;padding:0;background:#fff;box-shadow:none;border:0;border-radius:0}
    .second-step-title{
      margin:0 0 16px;
      height:auto;
      display:block;
      border:0;
      background:#fff;
      text-align:center;
    }
    .second-step-title h1{margin:0;font-size:22px;line-height:1.2;font-weight:400;letter-spacing:0}
    .notice.second-notice{
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:32px;
      margin:0 0 12px;
      padding:0 8px;
      border:0;
      background:#fff;
      color:#777;
      font-size:13px;
      line-height:2.3;
      text-align:center;
    }
    .notice .warn{display:none}
    .notice.is-card-used .card-key-notice{
      color:#999;
      text-decoration:line-through;
    }
    .notice.is-card-error .card-key-notice{
      color:var(--danger);
      text-decoration:none;
    }
    .notice:not(.is-card-used):not(.is-card-error) .card-key-notice{color:#777;text-decoration:none}
    .second-step-fields{
      display:grid;
      gap:0;
      margin:0;
      padding:0;
      border:1px solid var(--line);
      background:#fff;
    }
    .second-field{
      display:grid;
      grid-template-columns:66px minmax(0,1fr) 78px;
      grid-template-rows:42px;
      align-items:center;
      gap:0;
      padding:0;
      border:0;
      border-bottom:1px solid var(--line);
      background:#fff;
    }
    .second-field:last-child{border-bottom:0}
    .second-field-label{
      height:42px;
      padding:0 6px;
      border-right:1px solid var(--line);
      color:#111;
      font-size:13px;
      line-height:42px;
      font-weight:400;
      text-align:center;
      white-space:nowrap;
    }
    .value{
      height:42px;
      min-width:0;
      padding:0 8px;
      border:0;
      border-radius:0;
      background:#fff;
      color:#111;
      font-size:14px;
      line-height:42px;
      font-weight:400;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      text-align:center;
    }
    .mini-action{
      width:78px;
      height:42px;
      padding:0;
      border:0;
      border-left:1px solid var(--line);
      border-radius:0;
      background:#f0f0f0;
      color:#111;
      font-size:14px;
      line-height:42px;
      text-align:center;
      cursor:pointer;
    }
    .mini-action:active{background:#ddd}
    .second-get{display:none!important}
    .simple-guide{
      margin:78px 0 0;
      padding:0;
      border:0;
      color:#111;
      font-size:13px;
      line-height:2.3;
      font-weight:400;
      display:grid;
      grid-template-columns:minmax(0,1fr) 150px;
      align-items:start;
      gap:8px;
    }
    .simple-guide p{
      min-height:0;
      margin:0;
      padding:0;
      border-bottom:0;
      white-space:nowrap;
    }
    .guide-text{
      min-width:0;
      display:block;
    }
    .guide-animation{
      margin:0;
      width:100%;
      max-width:150px;
      border:1px solid #d8d8d8;
      background:#fff;
      overflow:hidden;
    }
    .guide-animation img{
      display:block;
      width:100%;
      height:auto;
      border:0;
    }
    .support-btn{
      position:absolute;
      left:16px;
      right:auto;
      top:auto;
      bottom:calc(env(safe-area-inset-bottom) + 74px);
      min-width:68px;
      height:30px;
      padding:0 8px;
      border:1px solid #b71c1c;
      border-radius:0;
      background:#fff;
      color:#fff;
      color:var(--danger);
      font-size:13px;
      line-height:28px;
      box-shadow:none;
      cursor:pointer;
    }
    .modal-backdrop{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.25)}
    .modal-backdrop.is-open{display:flex}
    .modal,.preflight-modal{width:min(340px,100%);border-radius:14px;background:#fff;overflow:hidden}
    .modal-head,.preflight-head{padding:18px 18px 8px;text-align:left}
    .modal-head h2,.preflight-head h2{margin:0 0 8px;font-size:18px;font-weight:400;line-height:1.25}
    .modal-head p,.preflight-head p{margin:0;color:var(--muted);font-size:14px;line-height:1.4}
    .modal-body{padding:0 18px 18px}.modal-body label{display:grid;gap:8px;color:#111;font-size:15px}
    .modal-input{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:#fff;color:#111}
    .modal-actions,.preflight-actions{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px 18px}
    .modal-btn{min-width:78px;height:38px;border:0;border-radius:10px;padding:0 12px;background:#eee;color:#111;cursor:pointer}
    .modal-btn.primary{background:#111;color:#fff}.modal-btn.secondary{background:#f1f1f1;color:#111}
    .code-guide-modal{
      width:min(350px,100%);
      max-height:calc(100svh - 36px);
      overflow:auto;
      border-radius:0;
      background:#fff;
      border:1px solid #222;
    }
    .code-guide-title{
      margin:0;
      padding:12px 10px 10px;
      color:#111;
      font-size:16px;
      line-height:1.45;
      font-weight:400;
      text-align:center;
    }
    .code-guide-image{
      display:block;
      width:100%;
      height:auto;
      border-top:1px solid #ddd;
      border-bottom:1px solid #ddd;
    }
    .code-guide-actions{
      padding:10px;
      text-align:center;
    }
    .code-guide-close{
      width:120px;
      height:36px;
      border:1px solid #222;
      border-radius:0;
      background:#fff;
      color:#111;
      font-size:14px;
      line-height:34px;
      cursor:pointer;
    }
    .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);z-index:80;max-width:min(340px,calc(100vw - 36px));transform:translateX(-50%) translateY(12px);padding:9px 12px;border-radius:999px;background:rgba(0,0,0,.78);color:#fff;font-size:14px;line-height:1.35;opacity:0;pointer-events:none;transition:.18s ease;text-align:center}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    @media (max-width:430px){
      html,body{background:#fff}
      .stage{
        flex-basis:100vw;
        width:100vw;
        max-width:none;
        padding-left:20px;
        padding-right:20px;
      }
    }
  </style>
</head>
<body class="app-loading-intro">
  <div class="page-loader" id="pageLoader" role="status" aria-live="polite"><p class="loader-title">数据加载中</p><div class="loader-spinner"></div></div>
  <div class="first-step-overlay" id="firstStepOverlay"><button id="firstStepNext" type="button"></button></div>
  <div class="stage">
    <main class="phone second-step-page" id="phoneShell">
      <section class="second-step-content" aria-label="自助登录">
        <div class="second-step-title"><h1>自助登录</h1></div>
        <div class="notice second-notice"><div class="warn">!</div><strong id="queueNotice" class="card-key-notice">读取中</strong></div>
        <section class="second-step-fields" aria-label="登录信息">
          <div class="second-field"><span class="second-field-label">登录号</span><div class="value" id="phoneView">打开软件后再获取！</div><button class="mini-action" type="button" data-get="account">获取号码</button></div>
          <div class="second-field"><span class="second-field-label">验证码</span><div class="value" id="codeView">获取后180秒有效</div><button class="mini-action" type="button" data-get="code">获取验证</button></div>
        </section>
        <button class="second-get" type="button" data-get="account">获取</button>
        <section class="simple-guide" aria-label="使用说明">
          <div class="guide-text">
            <p>使用说明：</p>
            <p>1. 获取号码，选正确的国际区号！</p>
            <p>2. 在软件输入然后获取验证码</p>
            <p>3. 回到本页面等待验证码</p>
          </div>
          <figure class="guide-animation" aria-label="国际区号选择演示">
            <img src="git.webp" alt="点击区号并选择对应国际区号">
          </figure>
        </section>
        <button class="support-btn" id="supportButton" type="button">联系客服</button>
      </section>
    </main>
  </div>
  <div class="modal-backdrop" id="activationModal" aria-hidden="true"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="activationModalTitle"><div class="modal-head"><h2 id="activationModalTitle">输入卡密</h2><p>点击确认后会向服务器发送激活请求。</p></div><form class="modal-body" id="activationForm"><label for="activationInput">卡密<input class="modal-input" id="activationInput" name="cardKey" type="text" autocomplete="off" placeholder="请输入卡密"></label><div class="modal-actions"><button class="modal-btn secondary" id="activationCancel" type="button">取消</button><button class="modal-btn primary" type="submit">确认激活</button></div></form></section></div>
  <div class="modal-backdrop" id="preflightModal" aria-hidden="true"><section class="preflight-modal" role="dialog" aria-modal="true" aria-labelledby="preflightTitle"><div class="preflight-head"><h2 id="preflightTitle">请先打开软件</h2><p>打开后再继续获取号码。</p></div><div class="preflight-actions"><button class="modal-btn secondary" id="preflightCancel" type="button" hidden>返回</button><button class="modal-btn primary" id="preflightConfirm" type="button">已打开软件</button></div></section></div>
  <div class="modal-backdrop" id="queueModal" aria-hidden="true"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="queueModalTitle"><div class="modal-head"><h2 id="queueModalTitle">排队取号中</h2><p id="queueModalMessage">请耐心等待，您是第1位，关闭页面重新排队。</p></div><div class="modal-actions"><button class="modal-btn primary" id="queueModalOk" type="button">知道了</button></div></section></div>
  <div class="modal-backdrop" id="readyConfirmModal" aria-hidden="true"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="readyConfirmTitle"><div class="modal-head"><h2 id="readyConfirmTitle">准备接码</h2><p id="readyConfirmMessage">已轮到你，请在10秒内确认开始。</p></div><div class="modal-actions"><button class="modal-btn primary" id="readyConfirmButton" type="button">确认接码</button></div></section></div>
  <div class="modal-backdrop" id="codeGuideModal" aria-hidden="true"><section class="code-guide-modal" role="dialog" aria-modal="true" aria-labelledby="codeGuideTitle"><h2 class="code-guide-title" id="codeGuideTitle">验证码已获取<br>请按下图给客服发过去</h2><img class="code-guide-image" src="code-received-guide.webp" alt="验证码获取后给客服发送设备信息说明"><div class="code-guide-actions"><button class="code-guide-close" id="codeGuideClose" type="button">已阅读关闭</button></div></section></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <script>
const __k = 173;

    const __p = Object.freeze({
      ar: __r(__v.e),

    const EMQX_CONFIG = {

      activationHours: 10,

      activationRequestTimeoutMs: 12000,
      accountRequestTimeoutMs: 10 * 60 * 1000,
      topicRoot: __r(__v.d),
      qos: 1
    };

    const missingCardKeyText = '卡密失效';
    const cardInvalidMessage = '卡密错误，请联系客服';
    const cardUsedMessage = '卡密为一次性卡密如有问题请咨询客服！';
    const codeExpireDelayMs = 200 * 1000;
    const codeRevealDelayMs = 45 * 1000;
    const activationDurationMs = EMQX_CONFIG.activationHours * 60 * 60 * 1000;
    const activationPasswordStorageKey = 'mumu_svip_activation_password';
    const activationSessionStorageKey = 'mumu_svip_activation_session';
    const usedCardStorageKey = 'mumu_svip_used_card_keys';

    const supportCooldownMessage = '客服正在来的路上，请在下单渠道等待客服处理';
    const usageGuideImageSources = [];

    const codeView = document.getElementById('codeView');
    const notice = document.getElementById('queueNotice');

    const toast = document.getElementById('toast');
    const pageLoader = document.getElementById('pageLoader');
    const firstStepOverlay = document.getElementById('firstStepOverlay');
    const firstStepNext = document.getElementById('firstStepNext');
    const activationModal = document.getElementById('activationModal');
    const activationForm = document.getElementById('activationForm');
    const activationInput = document.getElementById('activationInput');
    const activationCancel = document.getElementById('activationCancel');
    const preflightModal = document.getElementById('preflightModal');

    const readyConfirmButton = document.getElementById('readyConfirmButton');
    const codeGuideModal = document.getElementById('codeGuideModal');

    const stage = document.querySelector('.stage');

    const activationButton = document.getElementById('activationButton');

    const clientId = getClientId();
    const pageId = createPageId();
    let activationPasswordFromUrl = false;
    let activationPassword = getActivationPassword();
    const mqttTopics = createMqttTopics(clientId);

    let mqttClient = null;
    let mqttConnectPromise = null;
    let isActivated = false;
    let activationToken = '';
    let activationExpiresAt = 0;
    let activationExpireTimer = null;
    let activationCheckIntervalTimer = null;
    let pendingAuthRequestId = '';
    let pendingAuthCheckRequestId = '';
    let pendingAccountRequestId = '';
    let authTimeoutTimer = null;
    let authCheckTimeoutTimer = null;
    let accountTimeoutTimer = null;
    let authCheckResolve = null;
    let authCheckReject = null;
    let authCheckPromise = null;
    let pendingAuthCheckSilent = false;
    let mqttLibraryPromise = null;
    let indexPresenceMode = 'open';
    let indexPresenceTimer = null;
    let countdownTimer = null;
    let codeRevealTimer = null;
    let codeExpireTimer = null;
    let currentRequestId = 0;
    let getPreflightConfirmed = false;
    let getPreflightResolve = null;
    let getPreflightPromise = null;
    let readyConfirmPayload = null;
    let readyConfirmTimer = null;
    let pendingCodeGuide = null;
    let lastQueueMessage = '';
    let pageLoaderHidden = false;

    let pageLoaderMinTimeDone = false;
    let firstStepDismissed = false;

    function getClientId() {
      const storageKey = 'mumu_svip_client_id';
      const saved = localStorage.getItem(storageKey);
      if (saved && /^[a-zA-Z0-9_-]{8,80}$/.test(saved)) return saved;

      const next = (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}_${Math.random().toString(16).slice(2)}`).replace(/-/g, '');
      localStorage.setItem(storageKey, next);
      return next;
    }

    function createPageId() {
      const next = (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}_${Math.random().toString(16).slice(2)}`).replace(/-/g, '');
      return `page_${next}`;
    }

    function getActivationPassword() {
      const params = new URLSearchParams(location.search);
      for (const name of EMQX_CONFIG.activationParamNames) {
        const value = params.get(name);
        if (value && value.trim()) {
          const password = value.trim();
          const savedPassword = localStorage.getItem(activationPasswordStorageKey) || '';
          if (savedPassword && savedPassword !== password) {
            localStorage.removeItem(activationSessionStorageKey);
          }
          activationPasswordFromUrl = true;
          localStorage.setItem(activationPasswordStorageKey, password);
          clearUsedCardKey(password);
          cleanActivationParamsFromUrl(params);
          return password;
        }
      }
      return localStorage.getItem(activationPasswordStorageKey) || '';
    }

    function cleanActivationParamsFromUrl(params) {
      const nextParams = new URLSearchParams(params);
      EMQX_CONFIG.activationParamNames.forEach((name) => nextParams.delete(name));
      const query = nextParams.toString();
      const nextUrl = `${location.pathname}${query ? `?${query}` : ''}${location.hash}`;
      history.replaceState(null, '', nextUrl);
    }

    function setActivationPassword(value) {
      const nextPassword = String(value || '').trim();
      if (activationPassword && activationPassword !== nextPassword) {
        clearActivationSession();
      }
      activationPassword = nextPassword;
      if (activationPassword) {
        localStorage.setItem(activationPasswordStorageKey, activationPassword);
        clearUsedCardKey(activationPassword);
      } else {
        localStorage.removeItem(activationPasswordStorageKey);
      }
      renderCardKeyNotice();
    }

    function openActivationModal() {
      if (isActivated) {
        showToast('服务已激活');
        return;

      activationInput.value = activationPassword || '';
      activationModal.classList.add('is-open');
      activationModal.setAttribute('aria-hidden', 'false');
      setTimeout(() => activationInput.focus(), 0);
    }

    function closeActivationModal() {
      activationModal.classList.remove('is-open');
      activationModal.setAttribute('aria-hidden', 'true');
    }

      if (!pageLoader || pageLoaderHidden) return;

      pageLoaderHidden = true;

      requestAnimationFrame(() => {
        document.body.classList.remove('app-loading-intro');
      });
      setTimeout(() => pageLoader.remove(), 520);
    }

    function markPageLoaderReady() {
      pageLoaderReady = true;
      hidePageLoader();
    }

    function markPageLoaderMinTimeDone() {
      pageLoaderMinTimeDone = true;
      hidePageLoader();
    }

    function showPageLoaderError(message) {
      const title = pageLoader?.querySelector('.loader-title');
      if (title) {
        title.textContent = message || '素材加载失败';
        title.style.fontSize = 'calc(var(--app-width) * .064)';
      }
    }

    function dismissFirstStep() {
      if (firstStepDismissed) return;
      firstStepDismissed = true;
      getPreflightConfirmed = true;
      firstStepOverlay?.classList.add('is-hidden');
      document.body.classList.remove('app-waiting-intro');
      setTimeout(() => firstStepOverlay?.remove(), 280);
      fitPhone();
    }

    function hydrateGuideImages() {
      markPageLoaderReady();
    }

    function requestGetPreflight() {
      getPreflightConfirmed = true;
      return Promise.resolve(true);
      if (getPreflightConfirmed || !preflightModal) return Promise.resolve(true);
      if (getPreflightPromise) return getPreflightPromise;

      preflightModal.classList.add('is-open');
      preflightModal.setAttribute('aria-hidden', 'false');
      getPreflightPromise = new Promise((resolve) => {
        getPreflightResolve = resolve;
      });
      return getPreflightPromise;
    }

    function resolveGetPreflight(confirmed) {
      if (confirmed) getPreflightConfirmed = true;
      preflightModal?.classList.remove('is-open');
      preflightModal?.setAttribute('aria-hidden', 'true');
      const resolve = getPreflightResolve;
      getPreflightResolve = null;
      getPreflightPromise = null;
      resolve?.(confirmed);
    }

    function createRequestId(prefix) {
      return `${prefix}_${Date.now()}_${Math.random().toString(16).slice(2)}`;
    }

    function createMqttTopics(id) {
      const root = EMQX_CONFIG.topicRoot.replace(/^\/+|\/+$/g, '');
      return {
        authRequest: `${root}/${__p.ar}/${id}`,
        authResult: `${root}/${__p.as}/${id}`,
        authCheckRequest: `${root}/${__p.acr}/${id}`,
        authCheckResult: `${root}/${__p.acs}/${id}`,
        accountRequest: `${root}/${__p.nr}/${id}`,
        accountResult: `${root}/${__p.ns}/${id}`,
        codeResult: `${root}/${__p.cr}/${id}`,
        supportRequest: `${root}/${__p.sr}/${id}`,
        supportResult: `${root}/${__p.ss}/${id}`,
        presenceRequest: `${root}/${__p.ar}/${id}`,
        presenceOffline: `${root}/${__p.ar}/${id}`,
        status: `${root}/${__p.st}/${id}`
      };
    }

    function isUsPhoneSource(item = {}) {
      const sourcePool = String(item.sourcePool || '').toLowerCase();
      const sourceLabel = String(item.sourceLabel || '');
      const digits = String(item.phone || '').trim().replace(/\D/g, '');
      return sourcePool === 'us' || sourceLabel.includes('美区') || digits.length === 10;
    }

    function formatSvipPhone(phone, item = {}) {
      const usPhone = isUsPhoneSource({ ...item, phone });
      let digits = String(phone || '').trim().replace(/^\*/, '1').replace(/\D/g, '');
      if (usPhone && digits.length === 11 && digits.startsWith('1')) digits = digits.slice(1);
      if (!usPhone && digits.length === 13 && digits.startsWith('86')) digits = digits.slice(2);
      const formatted = usPhone
        ? digits.replace(/^(\d{3})(\d{3})(\d{4})$/, '$1 $2 $3')
        : digits.replace(/^(\d{3})(\d{4})(\d{4})$/, '$1 $2 $3');
      return `${usPhone ? '(+1)' : '(+86)'} ${formatted || digits}`;
    }

    function showToast(text) {
      toast.textContent = text;
      toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('show'), 1300);
    }

    function getUsedCardKeys() {
      try {
        const saved = JSON.parse(localStorage.getItem(usedCardStorageKey) || '{}');
        return saved && typeof saved === 'object' && !Array.isArray(saved) ? saved : {};
      } catch (error) {
        return {};
      }
    }

    function clearUsedCardKey(cardKey) {
      if (!cardKey) return;
      const usedCards = getUsedCardKeys();
      if (!usedCards[cardKey]) return;
      delete usedCards[cardKey];
      localStorage.setItem(usedCardStorageKey, JSON.stringify(usedCards));
    }

    function isCurrentCardUsed() {
      return Boolean(activationPassword && getUsedCardKeys()[activationPassword]);
    }

    function setNoticeText(_text, options = {}) {
      renderCardKeyNotice(options.used === true);
    }

    function renderCardKeyNotice(forceUsed = false) {
      const cardKey = activationPassword || missingCardKeyText;
      const used = forceUsed === true;
      noticeBox.classList.toggle('is-card-used', used);
      noticeBox.classList.toggle('is-card-error', !activationPassword && !used);
      notice.classList.toggle('is-card-used-text', used);
      notice.textContent = cardKey;
    }

    function renderCardKeyError(_message) {
      noticeBox.classList.remove('is-card-used');
      noticeBox.classList.add('is-card-error');
      notice.classList.remove('is-card-used-text');
      notice.textContent = activationPassword || missingCardKeyText;
    }

    function markCurrentCardUsed() {
      if (activationPassword) {
        const usedCards = getUsedCardKeys();
        usedCards[activationPassword] = Date.now();
        localStorage.setItem(usedCardStorageKey, JSON.stringify(usedCards));
      }
      renderCardKeyNotice(true);
    }

    function formatCountdown(totalSeconds) {
      const minutes = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
      const seconds = String(totalSeconds % 60).padStart(2, '0');
      return `${minutes}:${seconds}`;
    }

    function formatWaitingCountdown(totalSeconds) {
      return `${totalSeconds}/200 等待中`;
    }

    function getQueuePosition(payload = {}) {
      const raw = payload.queuePosition ?? payload.position ?? payload.queueIndex ?? payload.rank;
      const position = Number(raw);
      return Number.isFinite(position) && position > 0 ? Math.floor(position) : 0;
    }

    function getQueueMessage(payload = {}) {
      const position = getQueuePosition(payload);
      if (position) return `请耐心等待，您是第${position}位，关闭页面重新排队。`;
      return payload.message || '排队等待，请勿离开页面';
    }

    function openQueueModal(payload = {}) {
      const message = getQueueMessage(payload);
      queueModalMessage.textContent = message;
      queueModal.classList.add('is-open');
      queueModal.setAttribute('aria-hidden', 'false');
    }

    function closeQueueModal() {
      queueModal.classList.remove('is-open');
      queueModal.setAttribute('aria-hidden', 'true');
    }

    function closeReadyConfirmModal() {
      clearInterval(readyConfirmTimer);
      readyConfirmTimer = null;
      readyConfirmPayload = null;
      readyConfirmModal.classList.remove('is-open');
      readyConfirmModal.setAttribute('aria-hidden', 'true');
    }

    function getConfirmRemainingSeconds(payload = {}) {
      const expiresAt = Date.parse(payload.confirmExpiresAt || '');
      if (Number.isFinite(expiresAt)) return Math.max(0, Math.ceil((expiresAt - Date.now()) / 1000));
      const remainingMs = Number(payload.confirmRemainingMs || 0);
      return remainingMs > 0 ? Math.ceil(remainingMs / 1000) : 10;
    }

    function openReadyConfirmModal(payload = {}) {
      closeQueueModal();
      clearInterval(readyConfirmTimer);
      readyConfirmPayload = payload;
      const render = () => {
        const seconds = getConfirmRemainingSeconds(payload);
        readyConfirmMessage.textContent = seconds > 0
          ? `已轮到你，请在${seconds}秒内确认开始。`
          : '确认超时，正在重新排队。';
        readyConfirmButton.disabled = seconds <= 0;
        if (seconds <= 0) {
          clearInterval(readyConfirmTimer);
          readyConfirmTimer = null;
        }
      };
      render();
      readyConfirmModal.classList.add('is-open');
      readyConfirmModal.setAttribute('aria-hidden', 'false');
      readyConfirmTimer = setInterval(render, 250);
    }

    function confirmReadyAccount() {
      if (!readyConfirmPayload || !pendingAccountRequestId) return;
      const payload = readyConfirmPayload;
      closeReadyConfirmModal();
      setIndexPresenceMode('getting');
      phoneView.textContent = '准备接码';
      codeView.textContent = '等待接码';
      setNoticeText('验证码获取中请勿离开页面');
      publishMqtt(mqttTopics.accountRequest, {
        type: 'account_confirm',
        clientId,
        requestId: payload.requestId || pendingAccountRequestId,
        taskId: payload.taskId || payload.id || '',
        activationToken,
        cardKey: activationPassword,
        ts: Date.now()
      }).catch((error) => {
        console.error(error);
        showToast(error.message || '确认失败，请等待重新排队');
      });
    }

    function showQueueState(payload = {}) {
      const queueMessage = getQueueMessage(payload);
      clearAccountTimer();
      clearCodeTimers();
      closeReadyConfirmModal();
      setIndexPresenceMode('queued');
      phoneView.classList.remove('is-fetched');
      phoneView.dataset.full = '';
      codeView.dataset.full = '';
      phoneView.textContent = '排队等待';
      codeView.textContent = getQueuePosition(payload) ? `第${getQueuePosition(payload)}位` : '等待空位';
      setNoticeText(queueMessage);
      openQueueModal(payload);
      if (queueMessage !== lastQueueMessage) {
        showToast(queueMessage);
        lastQueueMessage = queueMessage;
      }
    }

    function clearCodeTimers() {
      clearInterval(countdownTimer);
      clearTimeout(codeRevealTimer);
      clearTimeout(codeExpireTimer);
      countdownTimer = null;
      codeRevealTimer = null;
      codeExpireTimer = null;
    }

    function clearAccountTimer() {
      clearTimeout(accountTimeoutTimer);
      accountTimeoutTimer = null;
    }

    function showRetryRequired(message = '更换号码，请重新获取') {
      pendingAccountRequestId = '';
      clearAccountTimer();
      clearCodeTimers();
      closeQueueModal();
      closeReadyConfirmModal();
      setIndexPresenceMode('open');
      phoneView.classList.remove('is-fetched');
      phoneView.dataset.full = '';
      codeView.dataset.full = '';
      phoneView.textContent = '更换号码';
      codeView.textContent = '请重新获取';
      setNoticeText(message);
      lastQueueMessage = '';
      showToast(message);
    }

    function setActivationState(state, text) {
      if (!activationButton) return;
      activationButton.textContent = text;
      activationButton.classList.toggle('is-inactive', state === 'inactive');
      activationButton.classList.toggle('is-pending', state === 'pending');
      activationButton.classList.toggle('is-active', state === 'active');
      activationButton.disabled = state === 'pending';
    }

    function hasEmqxConfig() {
      return Boolean(
        EMQX_CONFIG.wsUrl &&
        !EMQX_CONFIG.wsUrl.includes('你的EMQX') &&
        EMQX_CONFIG.username &&
        EMQX_CONFIG.password
      );
    }

    function clearActivationSession() {
      clearTimeout(activationExpireTimer);
      clearInterval(activationCheckIntervalTimer);
      activationExpireTimer = null;
      activationCheckIntervalTimer = null;
      activationToken = '';
      activationExpiresAt = 0;
      localStorage.removeItem(activationSessionStorageKey);
    }

    function deactivateService(message) {
      isActivated = false;
      clearActivationSession();
      clearCodeTimers();
      clearAccountTimer();
      closeQueueModal();
      closeReadyConfirmModal();
      pendingAccountRequestId = '';
      setIndexPresenceMode('open');
      phoneView.classList.remove('is-fetched');
      phoneView.dataset.full = '';
      codeView.dataset.full = '';
      phoneView.textContent = '打开软件后再获取！';
      codeView.textContent = '获取后180秒有效';
      renderCardKeyNotice();
      setActivationState('inactive', '未激活');
      if (message) showToast(message);
    }

    function scheduleActivationExpire() {
      clearTimeout(activationExpireTimer);
      const remaining = activationExpiresAt - Date.now();
      if (remaining <= 0) {
        deactivateService('授权已过期');
        return;
      }

      activationExpireTimer = setTimeout(() => {
        deactivateService('授权已过期');
      }, remaining);
    }

    function startActivationMonitor() {
      clearInterval(activationCheckIntervalTimer);
      if (!isActivated) return;

      activationCheckIntervalTimer = setInterval(() => {
        if (!isActivated || document.visibilityState !== 'visible') return;
        checkActivationWithServer({ silent: true, reason: 'timer' }).catch((error) => {
          console.error(error);
        });
      }, EMQX_CONFIG.activationCheckIntervalMs);
    }

    function saveActivationSession() {
      localStorage.setItem(activationSessionStorageKey, JSON.stringify({
        clientId,
        cardKey: activationPassword,
        token: activationToken,
        expiresAt: activationExpiresAt
      }));
    }

    function restoreActivationSession() {
      try {
        const session = JSON.parse(localStorage.getItem(activationSessionStorageKey) || 'null');
        if (!session || session.clientId !== clientId || session.cardKey !== activationPassword || !session.token || !session.expiresAt || session.expiresAt <= Date.now()) {
          deactivateService();
          return;
        }

        isActivated = true;
        activationToken = session.token || '';
        activationExpiresAt = session.expiresAt;
        setActivationState('active', '已激活');
        renderCardKeyNotice();
        scheduleActivationExpire();
        startActivationMonitor();
        checkActivationWithServer({ silent: true, reason: 'restore' }).catch((error) => {
          console.error(error);
        });
      } catch (error) {
        deactivateService();
      }
    }

    function isActivationValid() {
      if (!isActivated) return false;
      if (!activationExpiresAt || activationExpiresAt <= Date.now()) {
        deactivateService('授权已过期');
        return false;
      }
      return true;
    }

    function resolveActivationExpiresAt(payload) {
      const serverExpiresAt = payload.expiresAt || payload.expireAt || payload.expiredAt;
      const parsedExpiresAt = typeof serverExpiresAt === 'number' ? serverExpiresAt : Date.parse(serverExpiresAt);
      if (Number.isFinite(parsedExpiresAt) && parsedExpiresAt > Date.now()) {
        return parsedExpiresAt;
      }

      const ttlMs = Number(payload.ttlMs || payload.expiresInMs);
      if (Number.isFinite(ttlMs) && ttlMs > 0) {
        return Date.now() + ttlMs;
      }

      return 0;
    }

    function parseMqttPayload(message) {
      const text = typeof message === 'string' ? message : new TextDecoder().decode(message);
      try {
        return JSON.parse(text);
      } catch (error) {
        return { message: text };
      }
    }

    function createFlowError(message, reason = '') {
      const error = new Error(message || '操作失败');
      error.reason = reason || '';
      return error;
    }

    function isCardInvalidReason(reason, message = '') {
      return reason === 'card_not_found' ||
        reason === 'key_not_found' ||
        reason === 'not_found_card' ||
        message.includes('卡密错误');
    }

    function isCardUsedReason(reason, message = '') {
      return reason === 'card_used' ||
        reason === 'used' ||
        reason === 'already_used' ||
        message.includes('已使用');
    }

    function loadMqttLibrary() {
      if (window.mqtt) return Promise.resolve();
      if (mqttLibraryPromise) return mqttLibraryPromise;

      const sources = [
        'https://cdn.jsdelivr.net/npm/mqtt/dist/mqtt.min.js',
        'https://unpkg.com/mqtt/dist/mqtt.min.js'
      ];

      mqttLibraryPromise = new Promise((resolve, reject) => {
        let index = 0;
        const loadNext = () => {
          if (window.mqtt) {
            resolve();
            return;
          }
          const src = sources[index++];
          if (!src) {
            reject(new Error('MQTT组件加载失败，请刷新重试'));
            return;
          }
          const script = document.createElement('script');
          script.src = src;
          script.async = true;
          script.onload = () => window.mqtt ? resolve() : loadNext();
          script.onerror = loadNext;
          document.head.appendChild(script);
        };
        loadNext();
      }).finally(() => {
        mqttLibraryPromise = null;
      });

      return mqttLibraryPromise;
    }

    function subscribeMqttTopics() {
      [
        mqttTopics.authResult,
        mqttTopics.authCheckResult,
        mqttTopics.accountResult,
        mqttTopics.codeResult,
        mqttTopics.supportResult,
        mqttTopics.status
      ].forEach((topic) => {
        mqttClient.subscribe(topic, { qos: EMQX_CONFIG.qos }, (error) => {
          if (error) console.error(`订阅失败：${topic}`, error);
        });
      });
    }

    function ensureMqttConnected() {
      if (!hasEmqxConfig()) {
        return Promise.reject(new Error('请先配置 EMQX 连接信息'));
      }

      if (mqttClient && mqttClient.connected) return Promise.resolve(mqttClient);
      if (mqttConnectPromise) return mqttConnectPromise;
      mqttConnectPromise = loadMqttLibrary().then(() => new Promise((resolve, reject) => {
        const connectOptions = {
          clientId,
          username: EMQX_CONFIG.username,
          password: EMQX_CONFIG.password,
          clean: true,
          connectTimeout: 8000,
          reconnectPeriod: 3000
        };

        mqttClient = mqtt.connect(EMQX_CONFIG.wsUrl, connectOptions);

        const timeout = setTimeout(() => {
          reject(new Error('EMQX 连接超时'));
        }, connectOptions.connectTimeout + 1200);

        mqttClient.on('connect', () => {
          clearTimeout(timeout);
          subscribeMqttTopics();
          startIndexPresenceHeartbeat();
          resolve(mqttClient);
        });

        mqttClient.on('message', handleMqttMessage);
        mqttClient.on('error', (error) => {
          console.error('EMQX 连接错误', error);
        });
      })).finally(() => {
        mqttConnectPromise = null;
      });

      return mqttConnectPromise;
    }

    function publishMqtt(topic, payload) {
      return ensureMqttConnected().then((client) => new Promise((resolve, reject) => {
        client.publish(topic, JSON.stringify(payload), { qos: EMQX_CONFIG.qos, retain: false }, (error) => {
          if (error) reject(error);
          else resolve();
        });
      }));
    }

    function normalizeIndexPresenceMode(mode) {
      return ['open', 'queued', 'getting', 'waiting_code', 'code_received', 'offline'].includes(mode) ? mode : 'open';
    }

    function indexPresencePayload(mode = indexPresenceMode) {
      const nextMode = normalizeIndexPresenceMode(mode);
      return {
        type: 'index_presence',
        clientId,
        pageId,
        cardKey: activationPassword,
        requestId: pendingAccountRequestId,
        mode: nextMode,
        getting: nextMode === 'queued' || nextMode === 'getting' || nextMode === 'waiting_code',
        activated: isActivated,
        visibility: document.visibilityState || 'visible',
        page: location.href,
        userAgent: navigator.userAgent || '',
        ts: Date.now()
      };
    }

    function publishIndexPresence(mode = indexPresenceMode) {
      indexPresenceMode = normalizeIndexPresenceMode(mode);
      if (!hasEmqxConfig() || !mqttClient || !mqttClient.connected || !mqttTopics.presenceRequest) return;
      mqttClient.publish(
        mqttTopics.presenceRequest,
        JSON.stringify(indexPresencePayload(indexPresenceMode)),
        { qos: EMQX_CONFIG.qos, retain: false }
      );
    }

    function setIndexPresenceMode(mode) {
      indexPresenceMode = normalizeIndexPresenceMode(mode);
      publishIndexPresence(indexPresenceMode);
    }

    function startIndexPresenceHeartbeat() {
      if (indexPresenceTimer) return;
      publishIndexPresence(indexPresenceMode);
      indexPresenceTimer = setInterval(() => {
        publishIndexPresence(indexPresenceMode);
      }, 1000);
    }

    function publishIndexOffline() {
      if (!mqttClient || !mqttClient.connected || !mqttTopics.presenceOffline) return;
      mqttClient.publish(
        mqttTopics.presenceOffline,
        JSON.stringify({ ...indexPresencePayload('offline'), online: false }),
        { qos: EMQX_CONFIG.qos, retain: false }
      );
    }

    function getSupportCooldownKey() {
      return `${supportCooldownStorageKey}_${activationPassword || clientId}`;
    }

    function supportCooldownRemaining() {
      const lastAt = Number(localStorage.getItem(getSupportCooldownKey()) || 0);
      if (!Number.isFinite(lastAt) || lastAt <= 0) return 0;
      return Math.max(0, supportCooldownMs - (Date.now() - lastAt));
    }

    function markSupportRequested() {
      localStorage.setItem(getSupportCooldownKey(), String(Date.now()));
    }

    function clearSupportRequested() {
      localStorage.removeItem(getSupportCooldownKey());
    }

    function requestManualSupport() {
      if (supportCooldownRemaining() > 0) {
        showToast(supportCooldownMessage);
        return;
      }
      if (!activationPassword) {
        showToast('链接缺少卡密，请联系客服');
        return;
      }

      const requestId = createRequestId('support');
      markSupportRequested();
      supportButton?.setAttribute('disabled', 'disabled');
      supportButton?.classList.add('is-pending');
      publishMqtt(mqttTopics.supportRequest, {
        type: 'support_request',
        clientId,
        requestId,
        cardKey: activationPassword,
        activationToken,
        pageUrl: location.href,
        phone: phoneView.textContent || '',
        codeStatus: codeView.textContent || '',
        userAgent: navigator.userAgent || '',
      }).then(() => {
        showToast('正在通知客服');
      }).catch((error) => {
        clearSupportRequested();
        showToast(error.message || '通知失败，请稍后重试');
      }).finally(() => {
        supportButton?.removeAttribute('disabled');
        supportButton?.classList.remove('is-pending');
      });
    }

    function applyActivationGranted(payload, options = {}) {
      const announce = options.announce !== false;
      const message = payload.message || options.message || '';
      const nextToken = payload.token || payload.activationToken || '';
      const nextExpiresAt = resolveActivationExpiresAt(payload);
      if (!nextToken || !Number.isFinite(nextExpiresAt) || nextExpiresAt <= Date.now()) {
        return false;
      }
      isActivated = true;
      activationToken = nextToken;
      activationExpiresAt = nextExpiresAt;
      saveActivationSession();
      scheduleActivationExpire();
      startActivationMonitor();
      setActivationState('active', '已激活');
      if (announce && message) showToast(message);
      return true;
    }

    function clearPendingAuthCheck() {
      clearTimeout(authCheckTimeoutTimer);
      authCheckTimeoutTimer = null;
      authCheckResolve = null;
      authCheckReject = null;
      authCheckPromise = null;
      pendingAuthCheckSilent = false;
    }

    function checkActivationWithServer(options = {}) {
      const silent = options.silent === true;
      if (!activationPassword) {
        deactivateService();
        return Promise.reject(new Error('缺少授权码'));
      }

      if (!isActivated) {
        return Promise.reject(new Error('授权未激活，请联系客服'));
      }

      if (authCheckPromise) return authCheckPromise;

      clearPendingAuthCheck();
      pendingAuthCheckRequestId = createRequestId('auth_check');
      pendingAuthCheckSilent = silent;
      if (!silent) setActivationState('pending', '验证中');

      authCheckPromise = new Promise((resolve, reject) => {
        authCheckResolve = resolve;
        authCheckReject = reject;

      publishMqtt(mqttTopics.authCheckRequest, {
        type: 'auth_check',
        clientId,
        requestId: pendingAuthCheckRequestId,
        cardKey: activationPassword,
        activationToken,
        activationExpiresAt,
        reason: options.reason || 'manual',
          ts: Date.now()
        }).catch((error) => {
          const rejectCheck = authCheckReject;
          clearPendingAuthCheck();
          if (!silent && isActivationValid()) setActivationState('active', '已激活');
          rejectCheck?.(error);
        });

        authCheckTimeoutTimer = setTimeout(() => {
          const rejectCheck = authCheckReject;
          clearPendingAuthCheck();
          if (!silent && isActivationValid()) setActivationState('active', '已激活');
          rejectCheck?.(new Error('授权验证超时'));
        }, EMQX_CONFIG.activationRequestTimeoutMs);
      });

      return authCheckPromise;
    }

    function activateService() {
      if (isActivated) {
        showToast('服务已激活');
        return;
      }

      if (!activationPassword) {
        renderCardKeyNotice();
        showToast('链接缺少卡密，请联系客服');
        return;
      }

      const requestId = createRequestId('auth');
      pendingAuthRequestId = requestId;
      renderCardKeyNotice();
      setActivationState('pending', '激活中');
      clearTimeout(authTimeoutTimer);

      const payload = {
        type: 'activate',
        clientId,
        requestId,
        cardKey: activationPassword,
        durationHours: EMQX_CONFIG.activationHours,
        page: location.href,
        userAgent: navigator.userAgent,
        ts: Date.now()
      };

      publishMqtt(mqttTopics.authRequest, payload)
        .then(() => {
          showToast('已提交激活');
          authTimeoutTimer = setTimeout(() => {
            if (isActivated || pendingAuthRequestId !== requestId) return;
            pendingAuthRequestId = '';
            setActivationState('inactive', '未激活');
            showToast('激活超时，请重试');
            authTimeoutTimer = null;
          }, EMQX_CONFIG.activationRequestTimeoutMs);
        })
        .catch((error) => {
          console.error(error);
          pendingAuthRequestId = '';
          clearTimeout(authTimeoutTimer);
          authTimeoutTimer = null;
          setActivationState('inactive', '未激活');
          showToast(error.message || '激活失败');
        });
    }

    function activateForGet() {
      if (!activationPassword) return Promise.reject(new Error(cardInvalidMessage));
      const requestId = createRequestId('auth_get');
      pendingAuthRequestId = requestId;
      renderCardKeyNotice();
      setActivationState('pending', '验证中');
      clearTimeout(authTimeoutTimer);
      return new Promise((resolve, reject) => {
        const finish = (error) => {
          clearTimeout(authTimeoutTimer);
          authTimeoutTimer = null;
          if (pendingAuthRequestId === requestId) pendingAuthRequestId = '';
          if (error) reject(error);
          else resolve();
        };
        window.__mumuResolveActivationForGet = (payload) => {
          const allowed = payload.ok === true || payload.success === true || payload.allowed === true || payload.status === 'ok';
          if (!allowed || !applyActivationGranted(payload, { announce: false })) {
            const reason = payload.reason || '';
            const message = String(payload.message || '');
            if (isCardUsedReason(reason, message)) {
              deactivateService();
              markCurrentCardUsed();
              finish(createFlowError(cardUsedMessage, reason));
              return;
            }
            if (isCardInvalidReason(reason, message)) {
              deactivateService();
              renderCardKeyError(cardInvalidMessage);
              finish(createFlowError(cardInvalidMessage, reason));
              return;
            }
            deactivateService(message || '授权验证失败');
            renderCardKeyNotice();
            finish(createFlowError(message || '授权验证失败', reason));
            return;
          }
          finish();
        };
        publishMqtt(mqttTopics.authRequest, {
          type: 'activate',
          clientId,
          requestId,
          cardKey: activationPassword,
          durationHours: EMQX_CONFIG.activationHours,
          page: location.href,
          userAgent: navigator.userAgent,
          ts: Date.now()
        }).catch((error) => {
          pendingAuthRequestId = '';
          setActivationState('inactive', '未激活');
          finish(error);
        });
        authTimeoutTimer = setTimeout(() => {
          if (pendingAuthRequestId !== requestId) return;
          pendingAuthRequestId = '';
          setActivationState('inactive', '未激活');
          finish(new Error('授权验证超时'));
        }, EMQX_CONFIG.activationRequestTimeoutMs);
      }).finally(() => {
        window.__mumuResolveActivationForGet = null;
      });
    }

    async function ensureActivationBeforeGet() {
      if (!activationPassword) throw new Error(cardInvalidMessage);
      if (!isActivationValid()) await activateForGet();
      await checkActivationWithServer({ reason: 'get_account' });
    }

    function autoActivateFromUrl() {
      if (!activationPasswordFromUrl || isActivated || !activationPassword) return;
      closeActivationModal();
      showToast('正在自动激活');
      activateService();
    }

    function startCodeWait(initialCode) {
      clearCodeTimers();

      const requestId = ++currentRequestId;
      let remaining = Math.floor(codeExpireDelayMs / 1000);
      codeView.textContent = formatWaitingCountdown(remaining);

      countdownTimer = setInterval(() => {
        if (requestId !== currentRequestId) return;
        remaining -= 1;
        if (remaining <= 0) {
          showRetryRequired();
          return;
        }
        codeView.textContent = formatWaitingCountdown(remaining);
      }, 1000);

      if (initialCode) {
        codeRevealTimer = setTimeout(() => {
          if (requestId !== currentRequestId) return;
          showCode(initialCode, {});
        }, codeRevealDelayMs);
      }

      codeExpireTimer = setTimeout(() => {
        if (requestId !== currentRequestId) return;
        showRetryRequired();
      }, codeExpireDelayMs);
    }

    function openCodeGuideModal(code, detail = {}) {
      pendingCodeGuide = { code, detail };
      if (!codeGuideModal) {
        revealPendingCodeGuide();
        return;
      }
      codeGuideModal.classList.add('is-open');
      codeGuideModal.setAttribute('aria-hidden', 'false');
    }

    function closeCodeGuideModal() {
      if (!codeGuideModal) return;
      codeGuideModal.classList.remove('is-open');
      codeGuideModal.setAttribute('aria-hidden', 'true');
    }

    function revealPendingCodeGuide() {
      if (!pendingCodeGuide) return;
      const { code, detail } = pendingCodeGuide;
      pendingCodeGuide = null;
      closeCodeGuideModal();
      codeView.textContent = code;
      codeView.dataset.full = code;
      setIndexPresenceMode('code_received');
      if (detail.cardExhausted !== false) markCurrentCardUsed();
    }

    function showCode(code, detail = {}) {
      clearCodeTimers();
      openCodeGuideModal(code, detail);
    }

    function renderAccount(item) {
      closeQueueModal();
      closeReadyConfirmModal();
      const loginValue = formatSvipPhone(item.phone, item);
      phoneView.textContent = loginValue;
      phoneView.dataset.full = loginValue;
      phoneView.classList.add('is-fetched');
      codeView.dataset.full = '';
      codeView.textContent = '等待';
      lastQueueMessage = '';
      setIndexPresenceMode('waiting_code');
      startCodeWait(item.code);
    }

    async function getAccount() {
      setIndexPresenceMode('getting');
      try {
        await ensureActivationBeforeGet();
      } catch (error) {
        setIndexPresenceMode('open');
        console.error(error);
        const message = error.message || '';
        const reason = error.reason || '';
        if (message === cardUsedMessage) {
          renderCardKeyNotice(true);
          showToast(cardUsedMessage);
          return;
        }
        if (isCardInvalidReason(reason, message)) {
          renderCardKeyError(cardInvalidMessage);
          showToast(cardInvalidMessage);
          return;
        }
        renderCardKeyNotice();
        showToast(message || '连接异常，请重试');
        return;
      }

      const preflightAccepted = await requestGetPreflight();
      if (!preflightAccepted) {
        setIndexPresenceMode('open');
        return;
      }

      clearCodeTimers();
      clearAccountTimer();
      pendingAccountRequestId = createRequestId('account');
      lastQueueMessage = '';
      phoneView.classList.remove('is-fetched');
      phoneView.dataset.full = '';
      codeView.dataset.full = '';
      phoneView.textContent = '分配中';
      codeView.textContent = '等待验证码';
      setNoticeText('正在为你分配登录号，请稍等');

      publishMqtt(mqttTopics.accountRequest, {
        type: 'account_request',
        clientId,
        requestId: pendingAccountRequestId,
        cardKey: activationPassword,
        activationToken,
        activationExpiresAt,
        page: location.href,
        userAgent: navigator.userAgent,
        queueSupported: true,
        maxConcurrency: 1,
        ts: Date.now()
      }).then(() => {
        accountTimeoutTimer = setTimeout(() => {
          if (pendingAccountRequestId !== '') {
            pendingAccountRequestId = '';
            setIndexPresenceMode('open');
            phoneView.classList.remove('is-fetched');
            phoneView.dataset.full = '';
            codeView.dataset.full = '';
            phoneView.textContent = '打开软件后再获取！';
            codeView.textContent = '获取后180秒有效';
            renderCardKeyNotice();
            showToast('获取超时，请重试');
          }
        }, EMQX_CONFIG.accountRequestTimeoutMs);
      }).catch((error) => {
        console.error(error);
        clearAccountTimer();
        pendingAccountRequestId = '';
        setIndexPresenceMode('open');
        phoneView.classList.remove('is-fetched');
        phoneView.dataset.full = '';
        codeView.dataset.full = '';
        phoneView.textContent = '打开软件后再获取！';
        codeView.textContent = '获取后180秒有效';
        renderCardKeyNotice();
        showToast(error.message || '获取失败');
      });
    }

    function handleActivationResult(payload) {
      if (payload.requestId && payload.requestId !== pendingAuthRequestId) return;
      if (typeof window.__mumuResolveActivationForGet === 'function') {
        const resolver = window.__mumuResolveActivationForGet;
        window.__mumuResolveActivationForGet = null;
        resolver(payload);
        return;
      }
      pendingAuthRequestId = '';
      clearTimeout(authTimeoutTimer);
      authTimeoutTimer = null;

      const allowed = payload.ok === true || payload.success === true || payload.allowed === true || payload.status === 'ok';
      const granted = allowed && applyActivationGranted(payload, { message: '激活成功' });
      if (!granted) {
        const reason = payload.reason || '';
        const message = payload.message || '';
        if (isCardInvalidReason(reason, message)) {
          deactivateService();
          renderCardKeyError(cardInvalidMessage);
          showToast(cardInvalidMessage);
          return;
        }
        if (isCardUsedReason(reason, message)) {
          deactivateService();
          markCurrentCardUsed();
          showToast(cardUsedMessage);
          return;
        }
        deactivateService(allowed ? '激活信息不完整' : (message || '激活失败'));
        return;
      }
    }

    function handleAuthCheckResult(payload) {
      if (payload.requestId && payload.requestId !== pendingAuthCheckRequestId) return;
      pendingAuthCheckRequestId = '';
      const resolveCheck = authCheckResolve;
      const rejectCheck = authCheckReject;
      const silent = pendingAuthCheckSilent;
      clearPendingAuthCheck();

      const allowed = payload.ok === true || payload.success === true || payload.allowed === true || payload.status === 'ok';
      const granted = allowed && applyActivationGranted(payload, {
        announce: !silent,
        message: payload.message || '授权有效'
      });
      if (!granted) {
        deactivateService(payload.message || '授权已过期');
        rejectCheck?.(new Error(payload.message || '授权已过期'));
        return;
      }
      resolveCheck?.(payload);
    }

    function handleAccountResult(payload) {
      if (payload.requestId && payload.requestId !== pendingAccountRequestId) return;
      const reason = payload.reason || '';
      const message = payload.message || '';
      const readyConfirm = payload.confirmRequired === true ||
        payload.status === 'awaiting_confirm' ||
        reason === 'ready_confirm';
      if (readyConfirm) {
        clearAccountTimer();
        clearCodeTimers();
        setIndexPresenceMode('queued');
        phoneView.classList.remove('is-fetched');
        phoneView.dataset.full = '';
        codeView.dataset.full = '';
        phoneView.textContent = '轮到你了';
        codeView.textContent = '请确认';
        setNoticeText('准备接码，请在10秒内确认');
        openReadyConfirmModal(payload);
        return;
      }
      const queued = payload.queued === true ||
        payload.status === 'queued' ||
        payload.status === 'queue_offline' ||
        reason === 'queued' ||
        reason === 'queue_busy' ||
        message.includes('排队');
      if (queued) {
        showQueueState(payload);
        return;
      }
      if (reason === 'confirmed' || payload.status === 'running') {
        clearAccountTimer();
        closeQueueModal();
        closeReadyConfirmModal();
        setIndexPresenceMode('getting');
        phoneView.classList.remove('is-fetched');
        phoneView.dataset.full = '';
        codeView.dataset.full = '';
        phoneView.textContent = '接码中';
        codeView.textContent = '等待验证码';
        setNoticeText(payload.message || '验证码获取中请勿离开页面');
        return;
      }
      clearAccountTimer();
      const ok = payload.ok !== false && payload.success !== false && payload.status !== 'error';
      if (!ok) {
        const noPhone = reason === 'no_phone' || message.includes('无号码') || message.includes('号码库暂无可用号码');
        const cardUsed = reason === 'card_used' || reason === 'used' || reason === 'already_used' || message.includes('卡密已使用') || message.includes('已使用');
        const manualRequired = reason === 'manual_required' || message.includes('人工处理');
        const retryRequired = reason === 'code_timeout' || reason === 'phone_invalid' || message.includes('更换号码') || message.includes('重新获取');
        pendingAccountRequestId = '';
        clearCodeTimers();
        setIndexPresenceMode('open');
        phoneView.classList.remove('is-fetched');
        phoneView.dataset.full = '';
        codeView.dataset.full = '';
        if (cardUsed) {
          phoneView.textContent = '联系客服';
          codeView.textContent = '卡密已使用';
          markCurrentCardUsed();
          showToast(cardUsedMessage);
          return;
        }

        if (manualRequired) {
          phoneView.textContent = '联系客服';
          codeView.textContent = '人工处理';
          setNoticeText('请联系客服人工处理！');
          showToast('请联系客服人工处理！');
          return;
        }

        if (retryRequired) {
          showRetryRequired(message || '更换号码，请重新获取');
          return;
        }

        if (noPhone) {
          phoneView.textContent = '无号码';
          codeView.textContent = '联系客服';
          setNoticeText('号码库暂无可用号码，请稍后再试');
          showToast('无号码');
          return;
        }

        if (reason === 'expired' || reason === 'revoked' || reason === 'not_activated' || reason === 'token_mismatch' || reason === 'client_mismatch') {
          phoneView.textContent = '未激活';
          codeView.textContent = '请联系客服';
          setNoticeText('请先完成激活审核');
        } else {
          phoneView.textContent = '打开软件后再获取！';
          codeView.textContent = '获取后180秒有效';
          renderCardKeyNotice();
        }
        showToast(message || '分配失败');
        return;
      }

      const phone = payload.phone || payload.account || payload.login || payload.loginNo;
      const code = payload.code || payload.verifyCode || payload.smsCode;
      if (!phone) {
        pendingAccountRequestId = '';
        clearCodeTimers();
        setIndexPresenceMode('open');
        phoneView.classList.remove('is-fetched');
        phoneView.dataset.full = '';
        codeView.dataset.full = '';
        showToast(payload.message || '未收到登录号');
        return;
      }

      renderAccount({ ...payload, phone, code });
      closeQueueModal();
      closeReadyConfirmModal();
    }

    function handleCodeResult(payload) {
      if (payload.requestId && payload.requestId !== pendingAccountRequestId) return;
      clearAccountTimer();
      const ok = payload.ok !== false && payload.success !== false && payload.status !== 'error';
      const reason = payload.reason || '';
      const message = payload.message || '';
      if (!ok) {
        setIndexPresenceMode('open');
        if (reason === 'manual_required' || message.includes('人工处理')) {
          pendingAccountRequestId = '';
          clearCodeTimers();
          phoneView.classList.remove('is-fetched');
          phoneView.dataset.full = '';
          codeView.dataset.full = '';
          phoneView.textContent = '联系客服';
          codeView.textContent = '人工处理';
          setNoticeText('请联系客服人工处理！');
          showToast('请联系客服人工处理！');
          return;
        }
        if (reason === 'code_timeout' || reason === 'phone_invalid' || message.includes('更换号码') || message.includes('重新获取')) {
          showRetryRequired(message || '更换号码，请重新获取');
          return;
        }
        showToast(message || '未收到验证码');
        return;
      }
      const code = payload.code || payload.verifyCode || payload.smsCode;
      if (!code) {
        showToast(payload.message || '未收到验证码');
        return;
      }
      closeQueueModal();
      closeReadyConfirmModal();
      showCode(code, payload);
      pendingAccountRequestId = '';
    }

    function handleSupportResult(payload) {
      const message = payload.message || (payload.ok === false ? supportCooldownMessage : '已通知客服，请在下单渠道等待客服处理');
      if (payload.ok === false && payload.reason !== 'rate_limited') {
        clearSupportRequested();
      }
      showToast(message);
    }

    function handleMqttMessage(topic, message) {
      const payload = parseMqttPayload(message);
      if (topic === mqttTopics.authResult) {
        handleActivationResult(payload);
        return;
      }
      if (topic === mqttTopics.authCheckResult) {
        handleAuthCheckResult(payload);
        return;
      }
      if (topic === mqttTopics.accountResult) {
        handleAccountResult(payload);
        return;
      }
      if (topic === mqttTopics.codeResult) {
        handleCodeResult(payload);
        return;
      }
      if (topic === mqttTopics.supportResult) {
        handleSupportResult(payload);
        return;
      }
      if (topic === mqttTopics.status) {
        const isOwnRequest = Boolean(pendingAccountRequestId) && (!payload.requestId || payload.requestId === pendingAccountRequestId);
        const isReadyConfirm = payload.confirmRequired === true ||
          payload.status === 'awaiting_confirm' ||
          payload.reason === 'ready_confirm';
        if (isOwnRequest && isReadyConfirm) {
          handleAccountResult(payload);
          return;
        }
        const isQueued = payload.queued === true ||
          payload.status === 'queued' ||
          payload.status === 'queue_offline' ||
          payload.reason === 'queued' ||
          payload.reason === 'queue_busy' ||
          payload.queuePosition ||
          String(payload.message || '').includes('排队');
        if (isOwnRequest && isQueued) {
          showQueueState(payload);
          return;
        }
        if (payload.message) showToast(payload.message);
      }
    }

    function fitPhone() {
      if (!stage || !phoneShell) return;
    }

    if (activationButton) {
      activationButton.addEventListener('click', () => {
        if (isActivated) {
          showToast('服务已激活');
          return;
        }
        openActivationModal();
      });
    }

    activationForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const value = activationInput.value.trim();
      if (!value) {
        showToast('请先输入卡密');
        activationInput.focus();
        return;
      }
      setActivationPassword(value);
      closeActivationModal();
      activateService();
    });

    activationCancel.addEventListener('click', closeActivationModal);
    activationModal.addEventListener('click', (event) => {
      if (event.target === activationModal) closeActivationModal();
    });
    preflightConfirm.addEventListener('click', () => resolveGetPreflight(true));
    preflightCancel.addEventListener('click', () => resolveGetPreflight(false));
    queueModalOk.addEventListener('click', closeQueueModal);
    readyConfirmButton.addEventListener('click', confirmReadyAccount);
    codeGuideClose?.addEventListener('click', revealPendingCodeGuide);
    firstStepNext?.addEventListener('click', dismissFirstStep);
    supportButton?.addEventListener('click', requestManualSupport);
    queueModal.addEventListener('click', (event) => {
      if (event.target === queueModal) closeQueueModal();
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && activationModal.classList.contains('is-open')) {
        closeActivationModal();
      }
    });

    document.querySelectorAll('[data-get]').forEach((button) => {
      button.addEventListener('click', () => {
        if (button.dataset.get === 'code') {
          if (!phoneView.dataset.full && !phoneView.classList.contains('is-fetched')) {
            showToast('请先获取号码');
            return;
          }
          showToast('验证码获取中请勿离开页面');
          return;
        }
        getAccount();
      });
    });

    window.addEventListener('resize', fitPhone);
    window.addEventListener('pagehide', publishIndexOffline);
    window.addEventListener('beforeunload', publishIndexOffline);
    document.addEventListener('visibilitychange', () => publishIndexPresence(indexPresenceMode));
    markPageLoaderMinTimeDone();
    hydrateGuideImages();
    renderCardKeyNotice();
    restoreActivationSession();
    autoActivateFromUrl();
    if (activationPassword) {
      ensureMqttConnected().catch((error) => console.error(error));
    }
    fitPhone();
  </script>
</body>
</html>
