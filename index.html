<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>账号登录</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #fbfbf9; color: #050505; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body { display: flex; justify-content: center; align-items: flex-start; overflow-x: hidden; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
    button { font: inherit; }

    .stage { --fit-scale: 1; width: 100%; min-height: 100dvh; display: flex; justify-content: center; align-items: flex-start; overflow: hidden; }
    .phone { position: relative; width: 390px; flex: 0 0 390px; min-height: 844px; height: 100dvh; overflow: hidden; background: #fbfbf9; transform: scale(var(--fit-scale)); transform-origin: top center; }
    .flow-page { position: absolute; inset: 0; background: #fbfbf9; opacity: 0; pointer-events: none; transition: opacity 360ms ease; }
    .flow-page.is-active { opacity: 1; pointer-events: auto; }

    .page-loader { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: #fff; opacity: 1; transition: opacity 320ms ease, visibility 320ms ease; }
    .page-loader.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .loader-content { position: relative; width: min(390px, 100vw); height: min(844px, 100dvh); background: #fff; }
    .loader-title { position: absolute; top: 335px; left: 50%; margin: 0; color: #050505; font-size: 42px; font-weight: 300; line-height: 1.15; letter-spacing: 0; white-space: nowrap; transform: translateX(-50%); }
    .spinner { position: absolute; top: 453px; left: 50%; width: 48px; height: 48px; transform: translateX(-50%); animation: spin 1s linear infinite; }
    .spinner span { position: absolute; top: 2px; left: 21px; width: 6px; height: 14px; border-radius: 999px; background: #111; transform-origin: 3px 22px; }
    .spinner span:nth-child(1) { opacity: 1; transform: rotate(0deg); }
    .spinner span:nth-child(2) { opacity: .92; transform: rotate(30deg); }
    .spinner span:nth-child(3) { opacity: .84; transform: rotate(60deg); }
    .spinner span:nth-child(4) { opacity: .76; transform: rotate(90deg); }
    .spinner span:nth-child(5) { opacity: .68; transform: rotate(120deg); }
    .spinner span:nth-child(6) { opacity: .6; transform: rotate(150deg); }
    .spinner span:nth-child(7) { opacity: .52; transform: rotate(180deg); }
    .spinner span:nth-child(8) { opacity: .44; transform: rotate(210deg); }
    .spinner span:nth-child(9) { opacity: .36; transform: rotate(240deg); }
    .spinner span:nth-child(10) { opacity: .28; transform: rotate(270deg); }
    .spinner span:nth-child(11) { opacity: .2; transform: rotate(300deg); }
    .spinner span:nth-child(12) { opacity: .12; transform: rotate(330deg); }
    @keyframes spin { to { transform: translateX(-50%) rotate(360deg); } }

    .content-rise { position: absolute; inset: 0; display: block; width: 100%; height: 100%; user-select: none; pointer-events: none; -webkit-user-drag: none; }
    .final-shot { position: absolute; inset: 0; z-index: 2; display: block; width: 100%; height: 100%; object-fit: cover; opacity: 0; user-select: none; pointer-events: none; -webkit-user-drag: none; animation: final-shot 7.4s ease forwards; }
    .title-move { position: absolute; top: 375.57px; left: 56.16px; z-index: 5; width: 278.03px; height: 92.51px; background-image: url("previews/未标题-2.png"); background-repeat: no-repeat; background-size: 390px 844px; background-position: -56.16px -375.57px; letter-spacing: 0; animation: title-move 7.4s cubic-bezier(.18, .88, .26, 1) forwards; }
    .title-main, .title-sub { display: none; }
    .content-rise { display: none; }
    .rise-piece { position: absolute; display: block; background-image: url("previews/未标题-3.png"); background-repeat: no-repeat; background-size: 390px 844px; pointer-events: none; }
    .rise-pro { top: 246px; left: 34px; width: 322px; height: 158px; background-position: -34px -246px; }
    .rise-basic { top: 432px; left: 34px; width: 322px; height: 174px; background-position: -34px -432px; }
    .rise-button { top: 664px; left: 133px; width: 124px; height: 66px; border-radius: 999px; background-position: -133px -664px; }
    .logo-halo, .logo-open, .logo-block, .tap-ring { position: absolute; pointer-events: none; }
    .logo-halo { z-index: 3; width: 124px; height: 124px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 214, 119, .36), rgba(255, 214, 119, 0) 58%), radial-gradient(circle, rgba(0, 122, 255, .16), rgba(0, 122, 255, 0) 68%); filter: blur(10px); opacity: 0; transform: translate(-50%, -50%) scale(.72); }
    .halo-pro { top: 323px; left: 203px; animation: halo-pro 7.4s ease-out forwards; }
    .halo-basic { top: 506px; left: 203px; animation: halo-basic 7.4s ease-out forwards; }
    .logo-open { display: none; z-index: 2; left: 203px; width: 116px; height: 96px; border: 1px solid rgba(0, 0, 0, .035); border-radius: 28px; background: rgba(255, 255, 255, .86); box-shadow: 0 18px 42px rgba(0, 0, 0, .08), inset 0 1px 0 rgba(255, 255, 255, .92); opacity: 0; transform: translate(-50%, -50%) scale(.42); transform-origin: center; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
    .logo-open::before { position: absolute; top: 18px; left: 18px; width: 42px; height: 7px; border-radius: 999px; background: rgba(0, 0, 0, .08); box-shadow: 0 20px 0 rgba(0, 0, 0, .06), 48px 20px 0 rgba(0, 0, 0, .045), 0 40px 0 rgba(0, 0, 0, .045); content: ""; }
    .open-pro { top: 323px; animation: open-pro 7.4s cubic-bezier(.16, .88, .24, 1) forwards; }
    .open-basic { top: 506px; animation: open-basic 7.4s cubic-bezier(.16, .88, .24, 1) forwards; }
    .logo-block { z-index: 4; overflow: visible; background-image: url("previews/未标题-3.png"); background-repeat: no-repeat; background-size: 390px 844px; opacity: 0; mix-blend-mode: multiply; will-change: transform, filter, opacity; }
    .logo-pro { top: 287px; left: 176px; width: 78px; height: 78px; border-radius: 21px; background-position: -176px -287px; transform-origin: center; animation: logo-pro 7.4s cubic-bezier(.2, .9, .18, 1) forwards; }
    .logo-basic { top: 464px; left: 171px; width: 88px; height: 88px; border-radius: 24px; background-position: -171px -464px; transform-origin: center; animation: logo-basic 7.4s cubic-bezier(.2, .9, .18, 1) forwards; }
    .tap-ring { z-index: 6; width: 62px; height: 62px; border-radius: 50%; opacity: 0; transform: translate(-50%, -50%) scale(.64); }
    .tap-ring::before, .tap-ring::after { position: absolute; inset: 6px; border: 2px solid rgba(0, 0, 0, .4); border-radius: 50%; content: ""; opacity: 0; }
    .tap-ring::after { inset: -1px; border-color: rgba(255, 193, 7, .42); }
    .tap-pro { top: 323px; left: 203px; }
    .tap-basic { top: 506px; left: 203px; }
    .tap-pro::before { animation: tap-pro-one 7.4s ease-out forwards; }
    .tap-pro::after { animation: tap-pro-two 7.4s ease-out forwards; }
    .tap-basic::before { animation: tap-basic-one 7.4s ease-out forwards; }
    .tap-basic::after { animation: tap-basic-two 7.4s ease-out forwards; }
    .next-hit { position: absolute; top: 685px; left: 50%; width: 126px; height: 62px; border: 0; border-radius: 999px; background: transparent; cursor: pointer; transform: translateX(-50%); }
    @keyframes title-move { 0%, 20% { opacity: 1; transform: translateY(0); filter: blur(0); } 45.99% { opacity: 1; transform: translateY(-270.24px); filter: blur(0); } 46%, 100% { opacity: 0; transform: translateY(-270.24px); filter: blur(0); } }
    @keyframes content-rise { 0%, 30% { opacity: 0; transform: translateY(34px); filter: blur(7px); } 50%, 100% { opacity: 1; transform: translateY(0); filter: blur(0); } }
    @keyframes final-shot { 0%, 45.99% { opacity: 0; } 46%, 100% { opacity: 1; } }
    @keyframes logo-pro { 0%, 55% { opacity: 0; transform: scale(1); filter: none; } 58% { opacity: .82; transform: scale(1); filter: none; } 61% { opacity: .95; transform: scale(.9); filter: brightness(1.08) saturate(1.08); } 64% { opacity: .95; transform: scale(1.08); filter: brightness(1.05) saturate(1.12); } 67% { opacity: .92; transform: scale(.92); filter: brightness(1.08) saturate(1.08); } 72%, 100% { opacity: 0; transform: scale(1); filter: none; } }
    @keyframes logo-basic { 0%, 69% { opacity: 0; transform: scale(1); filter: none; } 72% { opacity: .82; transform: scale(1); filter: none; } 75% { opacity: .95; transform: scale(.9); filter: brightness(1.08) saturate(1.08); } 78% { opacity: .95; transform: scale(1.08); filter: brightness(1.05) saturate(1.12); } 81% { opacity: .92; transform: scale(.92); filter: brightness(1.08) saturate(1.08); } 86%, 100% { opacity: 0; transform: scale(1); filter: none; } }
    @keyframes halo-pro { 0%, 58%, 76%, 100% { opacity: 0; transform: translate(-50%, -50%) scale(.72); } 63%, 70% { opacity: 1; transform: translate(-50%, -50%) scale(1.12); } }
    @keyframes halo-basic { 0%, 72%, 90%, 100% { opacity: 0; transform: translate(-50%, -50%) scale(.72); } 77%, 84% { opacity: 1; transform: translate(-50%, -50%) scale(1.12); } }
    @keyframes open-pro { 0%, 58%, 78%, 100% { opacity: 0; transform: translate(-50%, -50%) scale(.42); } 63% { opacity: .78; transform: translate(-50%, -50%) scale(1.04); } 72% { opacity: .12; transform: translate(-50%, -50%) scale(1.32) translateY(-10px); } }
    @keyframes open-basic { 0%, 72%, 92%, 100% { opacity: 0; transform: translate(-50%, -50%) scale(.42); } 77% { opacity: .78; transform: translate(-50%, -50%) scale(1.04); } 86% { opacity: .12; transform: translate(-50%, -50%) scale(1.32) translateY(-10px); } }
    @keyframes tap-pro-one { 0%, 57% { opacity: 0; transform: scale(.52); } 60% { opacity: .48; transform: scale(.78); } 66%, 100% { opacity: 0; transform: scale(1.65); } }
    @keyframes tap-pro-two { 0%, 65% { opacity: 0; transform: scale(.52); } 68% { opacity: .48; transform: scale(.78); } 74%, 100% { opacity: 0; transform: scale(1.65); } }
    @keyframes tap-basic-one { 0%, 71% { opacity: 0; transform: scale(.52); } 74% { opacity: .48; transform: scale(.78); } 80%, 100% { opacity: 0; transform: scale(1.65); } }
    @keyframes tap-basic-two { 0%, 79% { opacity: 0; transform: scale(.52); } 82% { opacity: .48; transform: scale(.78); } 88%, 100% { opacity: 0; transform: scale(1.65); } }

    .account-page { background: #fbfbf9; }
    .account-empty { z-index: 0; }
    .value { position: absolute; z-index: 2; left: 116px; width: 178px; height: 42px; display: flex; align-items: center; justify-content: center; color: #050505; font-size: 22px; font-weight: 800; line-height: 1.05; letter-spacing: 0; white-space: nowrap; text-align: center; opacity: 1; transition: opacity 260ms ease; }
    #phoneView { top: 359px; }
    #codeView { top: 427px; }
    .phone.is-cleared .value { opacity: 0; }
    .phone:not(.is-cleared) .value:empty::after { content: ""; }
    .copy { position: absolute; z-index: 3; top: 598px; left: 50%; width: 126px; height: 62px; border: 0; border-radius: 999px; background: transparent; color: transparent; cursor: pointer; transform: translateX(-50%); }
    .fetch-tap { position: absolute; z-index: 4; top: 625px; left: 50%; width: 56px; height: 56px; border-radius: 50%; opacity: 0; pointer-events: none; transform: translate(-50%, -50%); }
    .phone.is-tapping .fetch-tap { animation: button-tap 420ms ease-out; }
    .fetch-tap::before, .fetch-tap::after { position: absolute; inset: 7px; border: 2px solid rgba(0,0,0,.34); border-radius: 50%; content: ""; }
    .fetch-tap::after { inset: 0; opacity: .22; }
    @keyframes button-tap { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.55); } 24% { opacity: 1; transform: translate(-50%, -50%) scale(.78); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1.55); } }

    .notice, .visually-hidden-state { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
    .notice strong { display: block; }
    .notice.is-card-used, .notice .is-card-used-text { color: inherit; }
    .toast { position: fixed; left: 50%; bottom: max(30px, env(safe-area-inset-bottom)); z-index: 120; max-width: min(320px, calc(100vw - 36px)); padding: 12px 16px; border-radius: 999px; background: rgba(20,20,20,.88); color: #fff; font-size: 14px; font-weight: 650; text-align: center; opacity: 0; transform: translate(-50%, 12px); transition: opacity 180ms ease, transform 180ms ease; pointer-events: none; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    .modal-backdrop { position: fixed; inset: 0; z-index: 110; display: none; align-items: center; justify-content: center; padding: 24px; background: rgba(255,255,255,.64); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
    .modal-backdrop.is-open { display: flex; }
    .modal, .preflight-modal { width: min(342px, 100%); border-radius: 28px; background: rgba(255,255,255,.96); box-shadow: 18px 18px 44px rgba(0,0,0,.12), -14px -14px 32px rgba(255,255,255,.92); overflow: hidden; border: 1px solid rgba(0,0,0,.08); }
    .modal-head, .preflight-head { padding: 24px 20px 10px; text-align: center; }
    .modal-head h2, .preflight-head h2 { margin: 0; color: #050505; font-size: 22px; line-height: 1.25; font-weight: 700; }
    .modal-head p, .preflight-head p { margin: 8px 0 0; color: #777; font-size: 14px; line-height: 1.4; }
    .modal-body { padding: 8px 18px 18px; }
    .modal-body label { display: grid; gap: 8px; color: #555; font-size: 14px; }
    .modal-input { width: 100%; height: 48px; border: 1px solid rgba(0,0,0,.1); border-radius: 16px; padding: 0 14px; background: #f7f7f7; color: #050505; font: inherit; font-size: 16px; outline: 0; }
    .modal-actions, .preflight-actions { display: flex; gap: 10px; padding: 16px 18px 18px; }
    .modal-btn { flex: 1; height: 48px; border: 0; border-radius: 16px; font-size: 16px; font-weight: 700; cursor: pointer; }
    .modal-btn.primary { background: #050505; color: #fff; }
    .modal-btn.secondary { background: #f0f0f0; color: #050505; }
    .preflight-image { display: none; }
    .support-btn { position: absolute; right: 18px; bottom: 28px; z-index: 3; width: 112px; height: 46px; border: 0; border-radius: 999px; background: transparent; color: transparent; }
    .support-btn.is-pending { opacity: .6; }

    @media (max-width: 520px) {
      body { display: block; }
      .phone { width: 100vw; min-height: 100dvh; height: 100dvh; transform: none; }
      .loader-content { width: 100vw; height: 100dvh; }
    }

<body>
  <div class="page-loader" id="pageLoader" role="status" aria-live="polite">
    <div class="loader-content">
      <p class="loader-title">数据加载中</p>
      <div class="spinner" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <div class="stage">
    <main class="phone" id="phoneShell">
      <section class="flow-page software-page is-active" id="softwareStep" aria-label="第一步">
        <div class="title-move" aria-hidden="true">
          <span class="title-main">第一步</span>
          <span class="title-sub">请双击打开您的软件</span>
        </div>
        <div class="content-rise" aria-hidden="true">
          <span class="rise-piece rise-pro"></span>
          <span class="rise-piece rise-basic"></span>
          <span class="rise-piece rise-button"></span>
        </div>
        <img class="final-shot" src="previews/未标题-3.png" alt="">
        <span class="logo-halo halo-pro" aria-hidden="true"></span>
        <span class="logo-halo halo-basic" aria-hidden="true"></span>
        <span class="logo-open open-pro" aria-hidden="true"></span>
        <span class="logo-open open-basic" aria-hidden="true"></span>
        <span class="logo-block logo-pro" aria-hidden="true"></span>
        <span class="logo-block logo-basic" aria-hidden="true"></span>
        <span class="tap-ring tap-pro" aria-hidden="true"></span>
        <span class="tap-ring tap-basic" aria-hidden="true"></span>
        <button class="next-hit" id="preflightConfirm" type="button" aria-label="下一步"></button>
      </section>

      <section class="flow-page account-page" id="accountStep" aria-label="第二步">
        <img class="shot account-empty" src="previews/未标题-5.png" alt="">
        <div class="value" id="phoneView">打开软件后在获取！</div>
        <div class="value" id="codeView">获取后200秒有效</div>
        <button class="copy" type="button" data-get="account" aria-label="获取"></button>
        <span class="fetch-tap" aria-hidden="true"></span>
        <button class="support-btn" id="supportButton" type="button" aria-label="联系客服">联系客服</button>
      </section>

      <div class="notice" aria-hidden="true"><div class="warn">!</div><strong id="queueNotice" class="card-key-notice">读取中</strong></div>
      <button id="activationButton" type="button" class="visually-hidden-state">未激活</button>
    </main>
  </div>

  <div class="modal-backdrop" id="activationModal" aria-hidden="true">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="activationModalTitle">
      <div class="modal-head">
        <h2 id="activationModalTitle">输入卡密</h2>
        <p>点击确认后会向服务器发送激活请求。</p>
      </div>
      <form class="modal-body" id="activationForm">
        <label for="activationInput">卡密<input class="modal-input" id="activationInput" name="cardKey" type="text" autocomplete="off" placeholder="请输入卡密"></label>
        <div class="modal-actions">
          <button class="modal-btn secondary" id="activationCancel" type="button">取消</button>
          <button class="modal-btn primary" type="submit">确认激活</button>
        </div>
      </form>
    </section>
  </div>

  <div class="modal-backdrop" id="preflightModal" aria-hidden="true">
    <section class="preflight-modal" role="dialog" aria-modal="true" aria-labelledby="preflightTitle">
      <div class="preflight-head"><h2 id="preflightTitle">第一步请点击打开你的软件</h2><p>再进行下一步。</p></div>
      <img class="preflight-image" src="previews/未标题-3.png" alt="">
      <div class="preflight-actions">
        <button class="modal-btn secondary" id="preflightCancel" type="button" hidden>返回</button>
      </div>
    </section>
  </div>

  <div class="modal-backdrop" id="queueModal" aria-hidden="true">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="queueModalTitle">
      <div class="modal-head"><h2 id="queueModalTitle">排队取号中</h2><p id="queueModalMessage">请耐心等待，您是第1位，关闭页面重新排队。</p></div>
      <div class="modal-actions"><button class="modal-btn primary" id="queueModalOk" type="button">知道了</button></div>
    </section>
  </div>

  <div class="modal-backdrop" id="readyConfirmModal" aria-hidden="true">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="readyConfirmTitle">
      <div class="modal-head"><h2 id="readyConfirmTitle">准备接码</h2><p id="readyConfirmMessage">已轮到你，请在10秒内确认开始。</p></div>
      <div class="modal-actions"><button class="modal-btn primary" id="readyConfirmButton" type="button">确认接码</button></div>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

    function getClientId() {
      const storageKey = 'mumu_svip_client_id';
      const saved = localStorage.getItem(storageKey);
      if (saved && /^[a-zA-Z0-9_-]{8,80}$/.test(saved)) return saved;

      const next = (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}_${Math.random().toString(16).slice(2)}`).replace(/-/g, '');
      localStorage.setItem(storageKey, next);
      return next;
    }

    function createPageId() {
      const next = (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}_${Math.random().toString(16).slice(2)}`).replace(/-/g, '');
      return `page_${next}`;
    }

    function getActivationPassword() {
      const params = new URLSearchParams(location.search);
      for (const name of EMQX_CONFIG.activationParamNames) {
        const value = params.get(name);
        if (value && value.trim()) {
          const password = value.trim();
          const savedPassword = localStorage.getItem(activationPasswordStorageKey) || '';
          if (savedPassword && savedPassword !== password) {
            localStorage.removeItem(activationSessionStorageKey);
          }
          activationPasswordFromUrl = true;
          localStorage.setItem(activationPasswordStorageKey, password);
          clearUsedCardKey(password);
          cleanActivationParamsFromUrl(params);
          return password;
        }
      }
      return localStorage.getItem(activationPasswordStorageKey) || '';
    }

    function cleanActivationParamsFromUrl(params) {
      const nextParams = new URLSearchParams(params);
      EMQX_CONFIG.activationParamNames.forEach((name) => nextParams.delete(name));
      const query = nextParams.toString();
      const nextUrl = `${location.pathname}${query ? `?${query}` : ''}${location.hash}`;
      history.replaceState(null, '', nextUrl);
    }

    function setActivationPassword(value) {
      const nextPassword = String(value || '').trim();
      if (activationPassword && activationPassword !== nextPassword) {
        clearActivationSession();
      }
      activationPassword = nextPassword;
      if (activationPassword) {
        localStorage.setItem(activationPasswordStorageKey, activationPassword);
        clearUsedCardKey(activationPassword);

    function hydrateGuideImages() {
      const images = Array.from(document.querySelectorAll('[data-guide-image]'));
      if (!images.length) {
        hidePageLoader();
        return;
      }
      let pending = images.length;
      const done = () => {
        pending -= 1;
        if (pending <= 0) hidePageLoader();
      };
      images.forEach((image) => {
        let settled = false;
        const finishImage = () => {
          if (settled) return;
          settled = true;
          done();
        };
        let sourceIndex = Math.max(0, usageGuideImageSources.indexOf(image.getAttribute('src') || ''));
        const tryNextSource = () => {
          sourceIndex += 1;
          if (sourceIndex < usageGuideImageSources.length) {
            image.src = usageGuideImageSources[sourceIndex];
            return true;
          }
          image.alt = '图片加载失败，请刷新页面重试';
          return false;
        };
        image.decoding = 'async';
        image.addEventListener('load', finishImage, { once: true });
        image.addEventListener('error', () => {
          if (!tryNextSource()) finishImage();
        });
        if (!image.getAttribute('src')) image.src = usageGuideImageSources[0];
        if (image.complete) {
          setTimeout(() => {
            if (image.naturalWidth > 0) finishImage();
            else if (!tryNextSource()) finishImage();
          }, 0);
        }
      });
      setTimeout(hidePageLoader, 2800);
    }

      resolve?.(confirmed);

    function clearUsedCardKey(cardKey) {

    function formatCountdown(totalSeconds) {

    function getQueuePosition(payload = {}) {

    function scheduleActivationExpire() {
      clearTimeout(activationExpireTimer);
      const remaining = activationExpiresAt - Date.now();
      if (remaining <= 0) {
        deactivateService('授权已过期');
        return;
      }

      activationExpireTimer = setTimeout(() => {
        deactivateService('授权已过期');
      }, remaining);

    function startActivationMonitor() {
      clearInterval(activationCheckIntervalTimer);
      if (!isActivated) return;

      activationCheckIntervalTimer = setInterval(() => {
        if (!isActivated || document.visibilityState !== 'visible') return;
        checkActivationWithServer({ silent: true, reason: 'timer' }).catch((error) => {
          console.error(error);
        });
      }, EMQX_CONFIG.activationCheckIntervalMs);

    function saveActivationSession() {
      localStorage.setItem(activationSessionStorageKey, JSON.stringify({
        clientId,
        cardKey: activationPassword,
        token: activationToken,
        expiresAt: activationExpiresAt
      }));
    }

    function restoreActivationSession() {
      try {
        const session = JSON.parse(localStorage.getItem(activationSessionStorageKey) || 'null');
        if (!session || session.clientId !== clientId || session.cardKey !== activationPassword || !session.token || !session.expiresAt || session.expiresAt <= Date.now()) {
          deactivateService();
          return;
        }

        isActivated = true;
        activationToken = session.token || '';
        activationExpiresAt = session.expiresAt;
        setActivationState('active', '已激活');
        renderCardKeyNotice();
        scheduleActivationExpire();
        startActivationMonitor();
        checkActivationWithServer({ silent: true, reason: 'restore' }).catch((error) => {
          console.error(error);
        });
      } catch (error) {
        deactivateService();
      }
    }

    function isActivationValid() {
      if (!isActivated) return false;
      if (!activationExpiresAt || activationExpiresAt <= Date.now()) {
        deactivateService('授权已过期');
        return false;
      }
      return true;
    }

    function resolveActivationExpiresAt(payload) {
      const serverExpiresAt = payload.expiresAt || payload.expireAt || payload.expiredAt;
      const parsedExpiresAt = typeof serverExpiresAt === 'number' ? serverExpiresAt : Date.parse(serverExpiresAt);
      if (Number.isFinite(parsedExpiresAt) && parsedExpiresAt > Date.now()) {
        return parsedExpiresAt;
      }

      const ttlMs = Number(payload.ttlMs || payload.expiresInMs);
      if (Number.isFinite(ttlMs) && ttlMs > 0) {
        return Date.now() + ttlMs;
      }

      return 0;
    }

    function parseMqttPayload(message) {
      const text = typeof message === 'string' ? message : new TextDecoder().decode(message);
      try {
        return JSON.parse(text);
      } catch (error) {
        return { message: text };
      }
    }

    function createFlowError(message, reason = '') {
      const error = new Error(message || '操作失败');
      error.reason = reason || '';
      return error;
    }

    function isCardInvalidReason(reason, message = '') {
      return reason === 'card_not_found' ||
        reason === 'key_not_found' ||
        reason === 'not_found_card' ||
        message.includes('卡密错误');
    }

    function isCardUsedReason(reason, message = '') {
      return reason === 'card_used' ||
        reason === 'used' ||
        reason === 'already_used' ||
        message.includes('已使用');
    }

    function loadMqttLibrary() {
      if (window.mqtt) return Promise.resolve();
      if (mqttLibraryPromise) return mqttLibraryPromise;

      const sources = [
        'https://cdn.jsdelivr.net/npm/mqtt/dist/mqtt.min.js',
        'https://unpkg.com/mqtt/dist/mqtt.min.js'
      ];

      mqttLibraryPromise = new Promise((resolve, reject) => {
        let index = 0;
        const loadNext = () => {
          if (window.mqtt) {
            resolve();
            return;
          }
          const src = sources[index++];
          if (!src) {
            reject(new Error('MQTT组件加载失败，请刷新重试'));
            return;
          }
          const script = document.createElement('script');
          script.src = src;
          script.async = true;
          script.onload = () => window.mqtt ? resolve() : loadNext();
          script.onerror = loadNext;
          document.head.appendChild(script);
        };
        loadNext();
      }).finally(() => {
        mqttLibraryPromise = null;
      });

      return mqttLibraryPromise;
    }

    function subscribeMqttTopics() {
      [
        mqttTopics.authResult,
        mqttTopics.authCheckResult,
        mqttTopics.accountResult,
        mqttTopics.codeResult,
        mqttTopics.supportResult,
        mqttTopics.status
      ].forEach((topic) => {
        mqttClient.subscribe(topic, { qos: EMQX_CONFIG.qos }, (error) => {
          if (error) console.error(`订阅失败：${topic}`, error);
        });
      });
    }

    function ensureMqttConnected() {
      if (!hasEmqxConfig()) {
        return Promise.reject(new Error('请先配置 EMQX 连接信息'));
      }

      if (mqttClient && mqttClient.connected) return Promise.resolve(mqttClient);
      if (mqttConnectPromise) return mqttConnectPromise;
      mqttConnectPromise = loadMqttLibrary().then(() => new Promise((resolve, reject) => {
        const connectOptions = {
          clientId,
          username: EMQX_CONFIG.username,
          password: EMQX_CONFIG.password,
          clean: true,
          connectTimeout: 8000,
          reconnectPeriod: 3000
        };

        mqttClient = mqtt.connect(EMQX_CONFIG.wsUrl, connectOptions);

        const timeout = setTimeout(() => {
          reject(new Error('EMQX 连接超时'));
        }, connectOptions.connectTimeout + 1200);

        mqttClient.on('connect', () => {
          clearTimeout(timeout);
          subscribeMqttTopics();
          startIndexPresenceHeartbeat();
          resolve(mqttClient);
        });

        mqttClient.on('message', handleMqttMessage);
        mqttClient.on('error', (error) => {
          console.error('EMQX 连接错误', error);
        });
      })).finally(() => {
        mqttConnectPromise = null;
      });

      return mqttConnectPromise;
    }

    function publishMqtt(topic, payload) {
      return ensureMqttConnected().then((client) => new Promise((resolve, reject) => {
        client.publish(topic, JSON.stringify(payload), { qos: EMQX_CONFIG.qos, retain: false }, (error) => {
          if (error) reject(error);
          else resolve();
        });
      }));
    }

    function normalizeIndexPresenceMode(mode) {
      return ['open', 'queued', 'getting', 'waiting_code', 'code_received', 'offline'].includes(mode) ? mode : 'open';
    }

    function indexPresencePayload(mode = indexPresenceMode) {
      const nextMode = normalizeIndexPresenceMode(mode);
      return {
        type: 'index_presence',
        clientId,
        pageId,
        cardKey: activationPassword,
        requestId: pendingAccountRequestId,
        mode: nextMode,
        getting: nextMode === 'queued' || nextMode === 'getting' || nextMode === 'waiting_code',
        activated: isActivated,
        visibility: document.visibilityState || 'visible',
        page: location.href,
        userAgent: navigator.userAgent || '',
        ts: Date.now()
      };
    }

    function publishIndexPresence(mode = indexPresenceMode) {
      indexPresenceMode = normalizeIndexPresenceMode(mode);
      if (!hasEmqxConfig() || !mqttClient || !mqttClient.connected || !mqttTopics.presenceRequest) return;
      mqttClient.publish(
        mqttTopics.presenceRequest,
        JSON.stringify(indexPresencePayload(indexPresenceMode)),
        { qos: EMQX_CONFIG.qos, retain: false }
      );
    }

    function setIndexPresenceMode(mode) {
      indexPresenceMode = normalizeIndexPresenceMode(mode);
      publishIndexPresence(indexPresenceMode);
    }

    function startIndexPresenceHeartbeat() {
      if (indexPresenceTimer) return;
      publishIndexPresence(indexPresenceMode);
      indexPresenceTimer = setInterval(() => {
        publishIndexPresence(indexPresenceMode);
      }, 1000);
    }

    function publishIndexOffline() {
      if (!mqttClient || !mqttClient.connected || !mqttTopics.presenceOffline) return;
      mqttClient.publish(
        mqttTopics.presenceOffline,
        JSON.stringify({ ...indexPresencePayload('offline'), online: false }),
        { qos: EMQX_CONFIG.qos, retain: false }
      );
    }

    function getSupportCooldownKey() {
      return `${supportCooldownStorageKey}_${activationPassword || clientId}`;
    }

    function supportCooldownRemaining() {
      const lastAt = Number(localStorage.getItem(getSupportCooldownKey()) || 0);
      if (!Number.isFinite(lastAt) || lastAt <= 0) return 0;
      return Math.max(0, supportCooldownMs - (Date.now() - lastAt));
    }

    function markSupportRequested() {
      localStorage.setItem(getSupportCooldownKey(), String(Date.now()));
    }

    function clearSupportRequested() {
      localStorage.removeItem(getSupportCooldownKey());
    }

    function requestManualSupport() {
      if (supportCooldownRemaining() > 0) {
        showToast(supportCooldownMessage);
        return;
      }
      if (!activationPassword) {
        showToast('链接缺少卡密，请联系客服');
        return;
      }

      const requestId = createRequestId('support');
      markSupportRequested();
      supportButton?.setAttribute('disabled', 'disabled');
      supportButton?.classList.add('is-pending');
      publishMqtt(mqttTopics.supportRequest, {
        type: 'support_request',
        clientId,
        requestId,
        cardKey: activationPassword,
        activationToken,
        pageUrl: location.href,
        phone: phoneView.textContent || '',
        codeStatus: codeView.textContent || '',
        userAgent: navigator.userAgent || '',
      }).then(() => {
        showToast('正在通知客服');
      }).catch((error) => {
        clearSupportRequested();
        showToast(error.message || '通知失败，请稍后重试');
      }).finally(() => {
        supportButton?.removeAttribute('disabled');
        supportButton?.classList.remove('is-pending');
      });
    }

    function applyActivationGranted(payload, options = {}) {
      const announce = options.announce !== false;
      const message = payload.message || options.message || '';
      const nextToken = payload.token || payload.activationToken || '';
      const nextExpiresAt = resolveActivationExpiresAt(payload);
      if (!nextToken || !Number.isFinite(nextExpiresAt) || nextExpiresAt <= Date.now()) {
        return false;
      }
      isActivated = true;
      activationToken = nextToken;
      activationExpiresAt = nextExpiresAt;
      saveActivationSession();
      scheduleActivationExpire();
      startActivationMonitor();
      setActivationState('active', '已激活');
      if (announce && message) showToast(message);
      return true;
    }

    function clearPendingAuthCheck() {
      clearTimeout(authCheckTimeoutTimer);
      authCheckTimeoutTimer = null;
      authCheckResolve = null;
      authCheckReject = null;
      authCheckPromise = null;
      pendingAuthCheckSilent = false;
    }

    function checkActivationWithServer(options = {}) {
      const silent = options.silent === true;
      if (!activationPassword) {
        deactivateService();
        return Promise.reject(new Error('缺少授权码'));
      }

      if (!isActivated) {
        return Promise.reject(new Error('授权未激活，请联系客服'));
      }

      if (authCheckPromise) return authCheckPromise;

      clearPendingAuthCheck();
      pendingAuthCheckRequestId = createRequestId('auth_check');
      pendingAuthCheckSilent = silent;
      if (!silent) setActivationState('pending', '验证中');

      authCheckPromise = new Promise((resolve, reject) => {
        authCheckResolve = resolve;
        authCheckReject = reject;

      publishMqtt(mqttTopics.authCheckRequest, {
        type: 'auth_check',
        clientId,
        requestId: pendingAuthCheckRequestId,
        cardKey: activationPassword,
        activationToken,
        activationExpiresAt,
        reason: options.reason || 'manual',
          ts: Date.now()
        }).catch((error) => {
          const rejectCheck = authCheckReject;
          clearPendingAuthCheck();
          if (!silent && isActivationValid()) setActivationState('active', '已激活');
          rejectCheck?.(error);
        });

        authCheckTimeoutTimer = setTimeout(() => {
          const rejectCheck = authCheckReject;
          clearPendingAuthCheck();
          if (!silent && isActivationValid()) setActivationState('active', '已激活');
          rejectCheck?.(new Error('授权验证超时'));
        }, EMQX_CONFIG.activationRequestTimeoutMs);
      });

      return authCheckPromise;
    }

    function activateService() {
      if (isActivated) {
        showToast('服务已激活');
        return;
      }

      if (!activationPassword) {
        renderCardKeyNotice();
        showToast('链接缺少卡密，请联系客服');
        return;
      }

      const requestId = createRequestId('auth');
      pendingAuthRequestId = requestId;
      renderCardKeyNotice();
      setActivationState('pending', '激活中');
      clearTimeout(authTimeoutTimer);

      const payload = {
        type: 'activate',
        clientId,
        requestId,
        cardKey: activationPassword,
        durationHours: EMQX_CONFIG.activationHours,
        page: location.href,
        userAgent: navigator.userAgent,
        ts: Date.now()
      };

      publishMqtt(mqttTopics.authRequest, payload)
        .then(() => {
          showToast('已提交激活');
          authTimeoutTimer = setTimeout(() => {
            if (isActivated || pendingAuthRequestId !== requestId) return;
            pendingAuthRequestId = '';
            setActivationState('inactive', '未激活');
            showToast('激活超时，请重试');
            authTimeoutTimer = null;
          }, EMQX_CONFIG.activationRequestTimeoutMs);
        })
        .catch((error) => {
          console.error(error);
          pendingAuthRequestId = '';
          clearTimeout(authTimeoutTimer);
          authTimeoutTimer = null;
          setActivationState('inactive', '未激活');
          showToast(error.message || '激活失败');
        });
    }

    function activateForGet() {
      if (!activationPassword) return Promise.reject(new Error(cardInvalidMessage));
      const requestId = createRequestId('auth_get');
      pendingAuthRequestId = requestId;
      renderCardKeyNotice();
      setActivationState('pending', '验证中');
      clearTimeout(authTimeoutTimer);
      return new Promise((resolve, reject) => {
        const finish = (error) => {
          clearTimeout(authTimeoutTimer);
          authTimeoutTimer = null;
          if (pendingAuthRequestId === requestId) pendingAuthRequestId = '';
          if (error) reject(error);
          else resolve();
        };
        window.__mumuResolveActivationForGet = (payload) => {
          const allowed = payload.ok === true || payload.success === true || payload.allowed === true || payload.status === 'ok';
          if (!allowed || !applyActivationGranted(payload, { announce: false })) {
            const reason = payload.reason || '';
            const message = String(payload.message || '');
            if (isCardUsedReason(reason, message)) {
              deactivateService();
              markCurrentCardUsed();
              finish(createFlowError(cardUsedMessage, reason));
              return;
            }
            if (isCardInvalidReason(reason, message)) {
              deactivateService();
              renderCardKeyError(cardInvalidMessage);
              finish(createFlowError(cardInvalidMessage, reason));
              return;
            }
            deactivateService(message || '授权验证失败');
            renderCardKeyNotice();
            finish(createFlowError(message || '授权验证失败', reason));
            return;
          }
          finish();
        };
        publishMqtt(mqttTopics.authRequest, {
          type: 'activate',
          clientId,
          requestId,
          cardKey: activationPassword,
          durationHours: EMQX_CONFIG.activationHours,
          page: location.href,
          userAgent: navigator.userAgent,
          ts: Date.now()
        }).catch((error) => {
          pendingAuthRequestId = '';
          setActivationState('inactive', '未激活');
          finish(error);
        });
        authTimeoutTimer = setTimeout(() => {
          if (pendingAuthRequestId !== requestId) return;
          pendingAuthRequestId = '';
          setActivationState('inactive', '未激活');
          finish(new Error('授权验证超时'));
        }, EMQX_CONFIG.activationRequestTimeoutMs);
      }).finally(() => {
        window.__mumuResolveActivationForGet = null;
      });
    }

    async function ensureActivationBeforeGet() {
      if (!activationPassword) throw new Error(cardInvalidMessage);
      if (!isActivationValid()) await activateForGet();
      await checkActivationWithServer({ reason: 'get_account' });
    }

    function autoActivateFromUrl() {
      if (!activationPasswordFromUrl || isActivated || !activationPassword) return;
      closeActivationModal();
      showToast('正在自动激活');
      activateService();
    }

    function startCodeWait(initialCode) {
      clearCodeTimers();

      const requestId = ++currentRequestId;
      let remaining = Math.floor(codeExpireDelayMs / 1000);
      codeView.textContent = formatWaitingCountdown(remaining);

      countdownTimer = setInterval(() => {
        if (requestId !== currentRequestId) return;
        remaining -= 1;
        if (remaining <= 0) {
          showRetryRequired();
          return;
        }
        codeView.textContent = formatWaitingCountdown(remaining);
      }, 1000);

      if (initialCode) {
        codeRevealTimer = setTimeout(() => {
          if (requestId !== currentRequestId) return;
          showCode(initialCode, {});
        }, codeRevealDelayMs);
      }

      codeExpireTimer = setTimeout(() => {
        if (requestId !== currentRequestId) return;
        showRetryRequired();
      }, codeExpireDelayMs);
    }

    function showCode(code, detail = {}) {
      clearCodeTimers();
      codeView.textContent = code;
      codeView.dataset.full = code;
      setIndexPresenceMode('code_received');
      if (detail.cardExhausted !== false) markCurrentCardUsed();
    }

    function renderAccount(item) {
      closeQueueModal();
      closeReadyConfirmModal();
      const loginValue = formatSvipPhone(item.phone);
      phoneView.textContent = loginValue;
      phoneView.dataset.full = loginValue;
      phoneView.classList.add('is-fetched');
      codeView.dataset.full = '';
      codeView.textContent = '获取后200秒有效';
      lastQueueMessage = '';
      setIndexPresenceMode('waiting_code');
      startCodeWait(item.code);
    }

    async function getAccount() {
      setIndexPresenceMode('getting');
      try {
        await ensureActivationBeforeGet();
      } catch (error) {
        setIndexPresenceMode('open');
        console.error(error);
        const message = error.message || '';
        const reason = error.reason || '';
        if (message === cardUsedMessage) {
          renderCardKeyNotice(true);
          showToast(cardUsedMessage);
          return;
        }
        if (isCardInvalidReason(reason, message)) {
          renderCardKeyError(cardInvalidMessage);
          showToast(cardInvalidMessage);
          return;
        }
        renderCardKeyNotice();
        showToast(message || '连接异常，请重试');
        return;
      }

      const preflightAccepted = await requestGetPreflight();
      if (!preflightAccepted) {
        setIndexPresenceMode('open');
        return;
      }

      clearCodeTimers();
      clearAccountTimer();
      pendingAccountRequestId = createRequestId('account');
      lastQueueMessage = '';
      phoneView.classList.remove('is-fetched');
      phoneView.dataset.full = '';
      codeView.dataset.full = '';
      phoneView.textContent = '分配中';
      codeView.textContent = '等待验证码';
      setNoticeText('正在为你分配登录号，请稍等');

      publishMqtt(mqttTopics.accountRequest, {
        type: 'account_request',
        clientId,
        requestId: pendingAccountRequestId,
        activationToken,
        activationExpiresAt,
        queueSupported: true,
        maxConcurrency: 1,
        ts: Date.now()
      }).then(() => {
        accountTimeoutTimer = setTimeout(() => {
          if (pendingAccountRequestId !== '') {
            pendingAccountRequestId = '';
            setIndexPresenceMode('open');
            phoneView.classList.remove('is-fetched');
            phoneView.dataset.full = '';
            codeView.dataset.full = '';
            phoneView.textContent = '打开软件后在获取！';
            codeView.textContent = '获取后200秒有效';
            renderCardKeyNotice();
            showToast('获取超时，请重试');
          }
        }, EMQX_CONFIG.accountRequestTimeoutMs);
      }).catch((error) => {
        console.error(error);
        clearAccountTimer();
        pendingAccountRequestId = '';
        setIndexPresenceMode('open');
        phoneView.classList.remove('is-fetched');
        phoneView.dataset.full = '';
        codeView.dataset.full = '';
        phoneView.textContent = '打开软件后在获取！';
        codeView.textContent = '获取后200秒有效';
        renderCardKeyNotice();
        showToast(error.message || '获取失败');
      });
    }

    function handleActivationResult(payload) {
      if (payload.requestId && payload.requestId !== pendingAuthRequestId) return;
      if (typeof window.__mumuResolveActivationForGet === 'function') {
        const resolver = window.__mumuResolveActivationForGet;
        window.__mumuResolveActivationForGet = null;
        resolver(payload);
        return;
      }
      pendingAuthRequestId = '';
      clearTimeout(authTimeoutTimer);
      authTimeoutTimer = null;

      const allowed = payload.ok === true || payload.success === true || payload.allowed === true || payload.status === 'ok';
      const granted = allowed && applyActivationGranted(payload, { message: '激活成功' });
      if (!granted) {
        const reason = payload.reason || '';
        const message = payload.message || '';
        if (isCardInvalidReason(reason, message)) {
          deactivateService();
          renderCardKeyError(cardInvalidMessage);
          showToast(cardInvalidMessage);
          return;
        }
        if (isCardUsedReason(reason, message)) {
          deactivateService();
          markCurrentCardUsed();
          showToast(cardUsedMessage);
          return;
        }
        deactivateService(allowed ? '激活信息不完整' : (message || '激活失败'));
        return;
      }
    }

    function handleAuthCheckResult(payload) {
      if (payload.requestId && payload.requestId !== pendingAuthCheckRequestId) return;
      pendingAuthCheckRequestId = '';
      const resolveCheck = authCheckResolve;
      const rejectCheck = authCheckReject;
      const silent = pendingAuthCheckSilent;
      clearPendingAuthCheck();

      const allowed = payload.ok === true || payload.success === true || payload.allowed === true || payload.status === 'ok';
      const granted = allowed && applyActivationGranted(payload, {
        announce: !silent,
        message: payload.message || '授权有效'
      });
      if (!granted) {
        deactivateService(payload.message || '授权已过期');
        rejectCheck?.(new Error(payload.message || '授权已过期'));
        return;
      }
      resolveCheck?.(payload);
    }

    function handleAccountResult(payload) {
      if (payload.requestId && payload.requestId !== pendingAccountRequestId) return;
      const reason = payload.reason || '';
      const message = payload.message || '';
      const readyConfirm = payload.confirmRequired === true ||
        payload.status === 'awaiting_confirm' ||
        reason === 'ready_confirm';
      if (readyConfirm) {
        clearAccountTimer();
        clearCodeTimers();
        setIndexPresenceMode('queued');
        phoneView.classList.remove('is-fetched');
        phoneView.dataset.full = '';
        codeView.dataset.full = '';
        phoneView.textContent = '轮到你了';
        codeView.textContent = '请确认';
        setNoticeText('准备接码，请在10秒内确认');
        openReadyConfirmModal(payload);
        return;
      }
      const queued = payload.queued === true ||
        payload.status === 'queued' ||
        payload.status === 'queue_offline' ||
        reason === 'queued' ||
        reason === 'queue_busy' ||
        message.includes('排队');
      if (queued) {
        showQueueState(payload);
        return;
      }
      if (reason === 'confirmed' || payload.status === 'running') {
        clearAccountTimer();
        closeQueueModal();
        closeReadyConfirmModal();
        setIndexPresenceMode('getting');
        phoneView.classList.remove('is-fetched');
        phoneView.dataset.full = '';
        codeView.dataset.full = '';
        phoneView.textContent = '接码中';
        codeView.textContent = '等待验证码';
        setNoticeText(payload.message || '验证码获取中请勿离开页面');
        return;
      }
      clearAccountTimer();
      const ok = payload.ok !== false && payload.success !== false && payload.status !== 'error';
      if (!ok) {
        const noPhone = reason === 'no_phone' || message.includes('无号码') || message.includes('号码库暂无可用号码');
        const cardUsed = reason === 'card_used' || reason === 'used' || reason === 'already_used' || message.includes('卡密已使用') || message.includes('已使用');
        const manualRequired = reason === 'manual_required' || message.includes('人工处理');
        const retryRequired = reason === 'code_timeout' || reason === 'phone_invalid' || message.includes('更换号码') || message.includes('重新获取');
        pendingAccountRequestId = '';
        clearCodeTimers();
        setIndexPresenceMode('open');
        phoneView.classList.remove('is-fetched');
        phoneView.dataset.full = '';
        codeView.dataset.full = '';
        if (cardUsed) {
          phoneView.textContent = '联系客服';
          codeView.textContent = '卡密已使用';
          markCurrentCardUsed();
          showToast(cardUsedMessage);
          return;
        }

        if (manualRequired) {
          phoneView.textContent = '联系客服';
          codeView.textContent = '人工处理';
          setNoticeText('请联系客服人工处理！');
          showToast('请联系客服人工处理！');
          return;
        }

        if (retryRequired) {
          showRetryRequired(message || '更换号码，请重新获取');
          return;
        }

        if (noPhone) {
          phoneView.textContent = '无号码';
          codeView.textContent = '联系客服';
          setNoticeText('号码库暂无可用号码，请稍后再试');
          showToast('无号码');
          return;
        }

        if (reason === 'expired' || reason === 'revoked' || reason === 'not_activated' || reason === 'token_mismatch' || reason === 'client_mismatch') {
          phoneView.textContent = '未激活';
          codeView.textContent = '请联系客服';
          setNoticeText('请先完成激活审核');
        } else {
          phoneView.textContent = '打开软件后在获取！';
          codeView.textContent = '获取后200秒有效';
          renderCardKeyNotice();
        }
        showToast(message || '分配失败');
        return;
      }

      const phone = payload.phone || payload.account || payload.login || payload.loginNo;
      const code = payload.code || payload.verifyCode || payload.smsCode;
      if (!phone) {
        pendingAccountRequestId = '';
        clearCodeTimers();
        setIndexPresenceMode('open');
        phoneView.classList.remove('is-fetched');
        phoneView.dataset.full = '';
        codeView.dataset.full = '';
        showToast(payload.message || '未收到登录号');
        return;
      }

      renderAccount({ phone, code });
      closeQueueModal();
      closeReadyConfirmModal();
    }

    function handleCodeResult(payload) {
      if (payload.requestId && payload.requestId !== pendingAccountRequestId) return;
      clearAccountTimer();
      const ok = payload.ok !== false && payload.success !== false && payload.status !== 'error';
      const reason = payload.reason || '';
      const message = payload.message || '';
      if (!ok) {
        setIndexPresenceMode('open');
        if (reason === 'manual_required' || message.includes('人工处理')) {
          pendingAccountRequestId = '';
          clearCodeTimers();
          phoneView.classList.remove('is-fetched');
          phoneView.dataset.full = '';
          codeView.dataset.full = '';
          phoneView.textContent = '联系客服';
          codeView.textContent = '人工处理';
          setNoticeText('请联系客服人工处理！');
          showToast('请联系客服人工处理！');
          return;
        }
        if (reason === 'code_timeout' || reason === 'phone_invalid' || message.includes('更换号码') || message.includes('重新获取')) {
          showRetryRequired(message || '更换号码，请重新获取');
          return;
        }
        showToast(message || '未收到验证码');
        return;
      }
      const code = payload.code || payload.verifyCode || payload.smsCode;
      if (!code) {
        showToast(payload.message || '未收到验证码');
        return;
      }
      closeQueueModal();
      closeReadyConfirmModal();
      showCode(code, payload);
      pendingAccountRequestId = '';
    }

    function handleSupportResult(payload) {
      const message = payload.message || (payload.ok === false ? supportCooldownMessage : '已通知客服，请在下单渠道等待客服处理');
      if (payload.ok === false && payload.reason !== 'rate_limited') {
        clearSupportRequested();
      }
      showToast(message);
    }

    function handleMqttMessage(topic, message) {
      const payload = parseMqttPayload(message);
      if (topic === mqttTopics.authResult) {
        handleActivationResult(payload);
        return;
      }
      if (topic === mqttTopics.authCheckResult) {
        handleAuthCheckResult(payload);
        return;
      }
      if (topic === mqttTopics.accountResult) {
        handleAccountResult(payload);
        return;
      }
      if (topic === mqttTopics.codeResult) {
        handleCodeResult(payload);
        return;
      }
      if (topic === mqttTopics.supportResult) {
        handleSupportResult(payload);
        return;
      }
      if (topic === mqttTopics.status) {
        const isOwnRequest = Boolean(pendingAccountRequestId) && (!payload.requestId || payload.requestId === pendingAccountRequestId);
        const isReadyConfirm = payload.confirmRequired === true ||
          payload.status === 'awaiting_confirm' ||
          payload.reason === 'ready_confirm';
        if (isOwnRequest && isReadyConfirm) {
          handleAccountResult(payload);
          return;
        }
        const isQueued = payload.queued === true ||
          payload.status === 'queued' ||
          payload.status === 'queue_offline' ||
          payload.reason === 'queued' ||
          payload.reason === 'queue_busy' ||
          payload.queuePosition ||
          String(payload.message || '').includes('排队');
        if (isOwnRequest && isQueued) {
          showQueueState(payload);
          return;
        }
        if (payload.message) showToast(payload.message);
      }
    }

    function fitPhone() {
      const scale = Math.min(1, document.documentElement.clientWidth / 393);
      stage.style.setProperty('--fit-scale', scale.toFixed(4));
      phoneShell.style.minHeight = `${Math.ceil(window.innerHeight / scale)}px`;
    }

    if (activationButton) {
      activationButton.addEventListener('click', () => {
        if (isActivated) {
          showToast('服务已激活');
          return;
        }
        openActivationModal();
      });
    }

    activationForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const value = activationInput.value.trim();
      if (!value) {
        showToast('请先输入卡密');
        activationInput.focus();
        return;
      }
      setActivationPassword(value);
      closeActivationModal();
      activateService();
    });

    activationCancel.addEventListener('click', closeActivationModal);
    activationModal.addEventListener('click', (event) => {
      if (event.target === activationModal) closeActivationModal();
    });
    preflightConfirm.addEventListener('click', () => resolveGetPreflight(true));
    preflightCancel.addEventListener('click', () => resolveGetPreflight(false));
    queueModalOk.addEventListener('click', closeQueueModal);
    readyConfirmButton.addEventListener('click', confirmReadyAccount);
    supportButton?.addEventListener('click', requestManualSupport);
    queueModal.addEventListener('click', (event) => {
      if (event.target === queueModal) closeQueueModal();
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && activationModal.classList.contains('is-open')) {
        closeActivationModal();
      }
    });

    document.querySelectorAll('[data-get]').forEach((button) => {
      button.addEventListener('click', () => {
        getAccount();
      });
    });

    window.addEventListener('resize', fitPhone);
    window.addEventListener('load', () => setTimeout(hidePageLoader, 1600));
    window.addEventListener('pagehide', publishIndexOffline);
    window.addEventListener('beforeunload', publishIndexOffline);
    document.addEventListener('visibilitychange', () => publishIndexPresence(indexPresenceMode));
    setTimeout(hidePageLoader, 2200);
    renderCardKeyNotice();
    restoreActivationSession();
    autoActivateFromUrl();
    if (activationPassword) {
      ensureMqttConnected().catch((error) => console.error(error));
    }
    fitPhone();
  </script>
  <script>
    const softwareStep = document.getElementById('softwareStep');
    const accountStep = document.getElementById('accountStep');
    const fetchButton = document.querySelector('[data-get="account"]');

    function showFlowStep(step) {
      const showAccount = step === 'account';
      softwareStep.classList.toggle('is-active', !showAccount);
      accountStep.classList.toggle('is-active', showAccount);
    }

    preflightConfirm.addEventListener('click', () => {
      showFlowStep('account');

    fetchButton.addEventListener('click', () => {
      phoneShell.classList.remove('is-tapping', 'is-cleared');
      requestAnimationFrame(() => {
        phoneShell.classList.add('is-tapping', 'is-cleared');
      });
      window.setTimeout(() => phoneShell.classList.remove('is-tapping'), 430);
      window.setTimeout(() => phoneShell.classList.remove('is-cleared'), 900);
    });
  </script>
</body>
</html>
